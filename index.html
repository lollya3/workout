            </div>
          </div>
        </div>`;
      }

      if (item.logOpen && !item.logged) {
        const memHint = (last !== null || pr !== null)
          ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px;padding:6px 9px;background:var(--surface2);border-radius:var(--r);display:flex;gap:12px;flex-wrap:wrap">
              ${last !== null ? `<span>Last: <strong>${last} lbs</strong></span>` : ''}
              ${pr !== null && pr !== last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong></span>` : ''}
              ${pr !== null && pr === last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong> (your best!)</span>` : ''}
             </div>` : '';
        html += `<div style="background:var(--alight);border-radius:var(--r);padding:12px;margin:8px 0 4px;border:1px solid var(--accent)">
          ${memHint}
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px">
            <div><span class="lbl">Sets</span><input type="number" id="pls-${idx}" min="1" value="${defaultSets}" style="font-size:15px;padding:8px 9px"></div>
            <div><span class="lbl">Reps</span><input type="number" id="plr-${idx}" min="1" value="${defaultReps}" style="font-size:15px;padding:8px 9px"></div>
            <div><span class="lbl">Weight (lbs)</span><input type="number" id="plw-${idx}" min="0" value="${defaultWeight}" placeholder="0=BW" style="font-size:15px;padding:8px 9px"></div>
          </div>
          ${isBilateral ? `<div style="display:flex;gap:6px;margin-bottom:8px">
            <button class="stype ${item.handMode!=='total'?'on':''}" onclick="setPlanHandMode(${idx},'each')">Each hand</button>
            <button class="stype ${item.handMode==='total'?'on':''}" onclick="setPlanHandMode(${idx},'total')">Total weight</button>
          </div>
          <div id="plhint-${idx}" style="font-size:12px;color:var(--text3);margin-bottom:8px"></div>` : ''}
          <div style="display:flex;gap:8px;margin-bottom:4px">
            <button class="stype on" id="pltype-w-${idx}" onclick="setPlanSetType(${idx},'working')">Working set</button>
            <button class="stype" id="pltype-wu-${idx}" onclick="setPlanSetType(${idx},'warmup')">Warm-up</button>
          </div>
          <div id="pl-setlist-${idx}" style="margin:6px 0;display:flex;flex-direction:column;gap:4px"></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
            <button class="btn btn-sm" onclick="addPlanSet(${idx})" style="background:var(--surface)">+ Add set</button>
            <button class="btn btn-sm btn-g" onclick="savePlanItem(${idx})">&#10003; Save &amp; log</button>
          </div>
          <div id="pl-status-${idx}" style="font-size:12px;color:var(--accent);margin-top:5px;font-weight:500"></div>
        </div>`;
      }

      if (item.actionOpen) {
        html += `<div class="action-menu">
          <button class="action-item" onclick="openSwap(${idx})">&#8635; Swap exercise</button>
          <button class="action-item action-delete" onclick="deletePlanItem(${idx})">&#x2715; Delete today</button>
        </div>`;
      }
      if (item.swapOpen) html += buildSwapPanel(idx, ex.cat);
      html += `</div>`;
    });
    html += `<button class="add-ex-btn" onclick="openAddExercise('${sec.key}')">+ Add exercise to ${sec.label.toLowerCase()}</button>`;
    html += `</div>`;
  });
  const allLogged = plan.every(i => i.logged);
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center">
    ${allLogged
      ? `<div style="font-size:14px;color:var(--accent);font-weight:500;padding:8px 0">&#127942; Workout complete!</div>`
      : `<button class="btn btn-g" onclick="completeAll()">&#9998; Log next exercise</button>`}
    <button class="btn" onclick="buildPlan()">&#8635; Regenerate</button>
    <button class="btn btn-sm" onclick="qaAns={};qaStep=0;initCoach()">&#8592; Start over</button>
  </div>`;
  const _cp = document.getElementById('coach-plan'); if(_cp) _cp.innerHTML = html;
}

function toggleAction(idx) {
  plan[idx].actionOpen = !plan[idx].actionOpen;
  plan[idx].swapOpen = false;
  drawPlan();
}

function togglePlanDetail(idx) {
  plan[idx].detailOpen = !plan[idx].detailOpen;
  plan[idx].actionOpen = false;
  drawPlan();
}

function openSwap(idx) {
  plan[idx].swapOpen = true;
  plan[idx].actionOpen = false;
  drawPlan();
}

function toggleSwap(idx) { plan[idx].swapOpen = !plan[idx].swapOpen; drawPlan(); }

function deletePlanItem(idx) {
  plan.splice(idx, 1);
  drawPlan();
}

function parseReps(repsStr) {
  const match = String(repsStr).match(/\d+/);
  return match ? parseInt(match[0]) : 10;
}

function toggleLogForm(idx) {
  plan[idx].logOpen = !plan[idx].logOpen;
  plan[idx].actionOpen = false;
  plan[idx].planSets = [];
  drawPlan();
}

function setPlanHandMode(idx, mode) {
  plan[idx].handMode = mode;
  drawPlan();
  // Update hint
  const w = parseFloat(document.getElementById('plw-'+idx)?.value) || 0;
  const hint = document.getElementById('plhint-'+idx);
  if (hint) hint.textContent = mode==='each' && w>0 ? `${w} lbs each hand = ${w*2} lbs total` : mode==='total' && w>0 ? `${w} lbs total` : '';
}

function setPlanSetType(idx, t) {
  plan[idx].planSetType = t;
  const wBtn = document.getElementById(`pltype-w-${idx}`);
  const wuBtn = document.getElementById(`pltype-wu-${idx}`);
  if (wBtn) wBtn.classList.toggle('on', t==='working');
  if (wuBtn) wuBtn.classList.toggle('on', t==='warmup');
}

function addPlanSet(idx) {
  const sets = parseInt(document.getElementById('pls-'+idx)?.value) || 1;
  const reps = parseInt(document.getElementById('plr-'+idx)?.value) || 10;
  const weight = parseFloat(document.getElementById('plw-'+idx)?.value) || 0;
  const t = plan[idx].planSetType || 'working';
  const isBilateral = BILATERAL.has(plan[idx].exId) && weight > 0;
  const eachHand = isBilateral && plan[idx].handMode !== 'total';
  const totalWeight = eachHand ? weight * 2 : weight;
  const setEntry = {sets, reps, weight, type:t, eachHand, totalWeight};
  plan[idx].planSets.push(setEntry);
  // Render set list without full redraw
  const listEl = document.getElementById('pl-setlist-'+idx);
  if (listEl) {
    const wl = weight===0 ? 'bodyweight' : eachHand ? `${weight} lbs each hand (${totalWeight} lbs total)` : `${weight} lbs`;
    const chip = document.createElement('div');
    chip.className = `sc ${t}`;
    chip.innerHTML = `<span>${t==='warmup'?'<span style="font-size:10px;margin-right:4px;opacity:.7">WARM-UP</span>':''}${sets}&times;${reps} @ ${wl}</span>
      <button class="del-btn" onclick="removePlanSet(${idx},${plan[idx].planSets.length-1})">&#x2715;</button>`;
    listEl.appendChild(chip);
  }
}

function removePlanSet(idx, setIdx) {
  plan[idx].planSets[setIdx] = null;
  drawPlan();
}

function savePlanItem(idx) {
  const valid = plan[idx].planSets.filter(Boolean);
  if (!valid.length) {
    const s = document.getElementById('pl-status-'+idx);
    if (s) s.textContent = 'Add at least one set first.';
    return;
  }
  const ex = EX.find(e => e.id === plan[idx].exId);
  if (!ex) return;
  const date = localDate();
  const loc = qaAns.loc || 'gym';
  let ses = sessions.find(s => s.date===date);
  if (!ses) { ses = {id:Date.now(), date, entries:[]}; sessions.push(ses); }
  const existing = ses.entries.find(en => en.exId === plan[idx].exId && en.location === loc);
  if (existing) { existing.sets.push(...valid); }
  else { ses.entries.push({exId:plan[idx].exId, exName:ex.name, cat:ex.cat, location:loc, sets:valid}); }
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save();
  // Auto-add to favorites so it appears in My exercises
  favorites.add(plan[idx].exId);
  saveFavorites();
  plan[idx].logged = true;
  plan[idx].logOpen = false;
  plan[idx].planSets = [];
  drawPlan();
  // Update Today's session on Log tab
  renderTodayCard();
}

function unlogPlanItem(idx) {
  const date = localDate();
  const loc = qaAns.loc || 'gym';
  const ses = sessions.find(s => s.date===date);
  if (ses) {
    ses.entries = ses.entries.filter(en => !(en.exId === plan[idx].exId && en.location === loc));
    if (!ses.entries.length) sessions = sessions.filter(s => s.id !== ses.id);
    save();
  }
  plan[idx].logged = false;
  plan[idx].logOpen = false;
  plan[idx].planSets = [];
  drawPlan();
}

function logPlanItem(idx) { toggleLogForm(idx); }

function completeAll() {
  // Open log form for first unlogged item instead of auto-logging everything
  const first = plan.findIndex(i => !i.logged);
  if (first >= 0) toggleLogForm(first);
}

function doSwap(idx, newId) { plan[idx].exId = newId; plan[idx].swapOpen = false; drawPlan(); }

function buildSwapPanel(idx, cat) {
  const loc = qaAns.loc || 'gym';
  const alts = EX.filter(e => e.cat === cat && e.loc.includes(loc) && e.id !== plan[idx].exId).slice(0, 5);
  let html = `<div class="swap-panel"><div class="swap-ttl">Coach alternatives — ${CAT[cat]||cat}</div>`;
  if (alts.length) {
    alts.forEach(a => html += `<div class="swap-opt" onclick="doSwap(${idx},'${a.id}')"><span class="swap-nm">${a.name}</span><span class="swap-meta">${a.loc.map(l=>LOC[l]).join(', ')}</span></div>`);
  } else {
    html += `<div style="font-size:12px;color:var(--text3);padding:3px 0">No other options for this category at ${LOC[loc]}.</div>`;
  }
  html += `<button class="browse-link" onclick="openBrowse(${idx})">Browse all exercises &rarr;</button></div>`;
  return html;
}

let browseMode = 'swap'; // 'swap' or 'add'
let browseAddSec = null;

function openBrowse(idx) { browseIdx = idx; browseMode = 'swap'; browseCat = 'all'; document.getElementById('browse-modal').classList.add('on'); renderBrowse(); }

function openAddExercise(sec) {
  browseIdx = null; browseMode = 'add'; browseAddSec = sec; browseCat = 'all';
  document.getElementById('browse-modal').classList.add('on');
  renderBrowse();
}
function closeBrowse() { document.getElementById('browse-modal').classList.remove('on'); browseIdx = null; }

function renderBrowse() {
  document.getElementById('browse-chips').innerHTML =
    ['all',...CATS].map(c => `<button class="chip${browseCat===c?' on':''}" onclick="setBrowseCat('${c}')">${c==='all'?'All':CAT[c]}</button>`).join('');
  const list = EX.filter(e => browseCat === 'all' || e.cat === browseCat);
  document.getElementById('browse-list').innerHTML = list.map(e =>
    `<div class="br-row" onclick="browseSwap('${e.id}')"><span class="br-nm">${e.name}</span><span class="br-meta">${CAT[e.cat]}</span></div>`
  ).join('');
}

function setBrowseCat(c) { browseCat = c; renderBrowse(); }

function browseSwap(id) {
  if (browseMode === 'swap' && browseIdx !== null) {
    plan[browseIdx].exId = id;
    plan[browseIdx].swapOpen = false;
    plan[browseIdx].actionOpen = false;
  } else if (browseMode === 'add' && browseAddSec) {
    const {loc, goal, energy} = qaAns;
    plan.push({exId:id, sec:browseAddSec, ...getSR(goal,energy,browseAddSec), swapOpen:false, actionOpen:false, tip:tipFor(id,goal)});
  }
  closeBrowse(); drawPlan();
}

function loadPlanToLog() {
  if (!plan.length) return;
  showPage('coach');
  document.getElementById('ses-loc').value = qaAns.loc || 'gym';
  syncLoc();
  const first = plan.find(i => i.sec === 'main') || plan[0];
  if (first) selectEx(first.exId);
  window.scrollTo({top: 0, behavior:'smooth'});
  const sections = {
    warmup: plan.filter(i=>i.sec==='warmup').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    main:   plan.filter(i=>i.sec==='main').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    balance:plan.filter(i=>i.sec==='balance').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    stretch:plan.filter(i=>i.sec==='stretch').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
  };
  const note = document.createElement('div');
  note.className = 'coach-note';
  note.style.cssText = 'background:var(--alight);border:1px solid var(--accent);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-size:13px;color:var(--accent)';
  note.innerHTML = `<strong>&#127947; Coach plan loaded</strong><br>
    <span style="color:var(--text2)">Warm-up:</span> ${sections.warmup.join(', ')}<br>
    <span style="color:var(--text2)">Main:</span> ${sections.main.join(', ')}<br>
    <span style="color:var(--text2)">Balance:</span> ${sections.balance.join(', ')}<br>
    <span style="color:var(--text2)">Stretches:</span> ${sections.stretch.join(', ')}`;
  const pg = document.getElementById('page-coach');
  const ex = pg.querySelector('.coach-note'); if(ex) ex.remove();
  pg.insertBefore(note, pg.firstChild);
}

// ── HISTORY ────────────────────────────────────────────────
function renderHistory() {
  const lf = document.getElementById('hist-loc').value;
  const cf = document.getElementById('hist-cat').value;
  const filtered = sessions.filter(s => {
    if (lf !== 'all' && !s.entries.some(e => (e.location||'gym') === lf)) return false;
    if (cf !== 'all' && !s.entries.some(e => e.cat === cf)) return false;
    return true;
  });
  const el = document.getElementById('hist-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">No sessions logged yet.</div>'; return; }
  el.innerHTML = filtered.map(s => {
    const entries = s.entries.filter(e => cf === 'all' || e.cat === cf);
    const ds = new Date(s.date + 'T12:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    return `<div class="hc">
      <div class="hc-hd">
        <div>
          <span style="font-size:14px;font-weight:600">${ds}</span>
          <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm" style="font-size:11px;padding:3px 9px" onclick="editSessionDate(${s.id})">&#9998; Date</button>
            <button class="btn btn-sm" style="font-size:11px;padding:3px 9px;color:var(--danger);border-color:var(--danger)" onclick="delSession(${s.id})">&#x2715; Delete session</button>
          </div>
        </div>
      </div>
      ${entries.map((e, ei) => {
        const sIdx = sessions.findIndex(x => x.id === s.id);
        const eIdx = sessions[sIdx].entries.findIndex(x => x === e || (x.exId === e.exId && x.exName === e.exName));
        return `<div class="he">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div class="he-nm">${e.exName} <span class="pill pill-${e.location||'gym'}">${LOC[e.location||'gym']||'Gym'}</span></div>
            <button class="btn btn-sm" style="font-size:11px;padding:3px 9px;color:var(--danger);border-color:var(--danger)" onclick="delExEntry(${s.id},${eIdx})">&#x2715; Remove</button>
          </div>
          <div class="he-sets">
            ${e.sets.map((s2, si) => {
              const wl = s2.weight===0?'BW':s2.eachHand?`${s2.weight}lbs each`:s2.weight+'lbs';
              const tag = s2.type==='warmup'?'<span style="font-size:10px;background:var(--warn-light);color:var(--warn);padding:1px 5px;border-radius:8px;margin-right:3px">WU</span>':'';
              return `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)" id="set-row-${s.id}-${eIdx}-${si}">
                <span style="flex:1;font-size:13px">${tag}${s2.sets}&times;${s2.reps} @ ${wl}</span>
                <button class="btn btn-sm" style="font-size:11px;padding:3px 8px" onclick="editSet(${s.id},${eIdx},${si})">&#9998;</button>
                <button class="btn btn-sm" style="font-size:11px;padding:3px 8px;color:var(--danger);border-color:var(--danger)" onclick="delSet(${s.id},${eIdx},${si})">&#x2715;</button>
              </div>`;
            }).join('')}
          </div>
          ${e.sessionNote ? `<div style="font-size:13px;color:#1e5a8a;background:#eef6fc;border-left:3px solid #3b82c4;padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px;line-height:1.4">💬 ${e.sessionNote}</div>` : ''}
        </div>`;
      }).join('')}
      <!-- ADD EXERCISE TO SESSION -->
      <div style="margin-top:10px">
        <button class="btn btn-sm" onclick="showAddExToSession(${s.id})" style="width:100%;border-style:dashed;color:var(--accent);border-color:var(--accent)">&#43; Add exercise to this session</button>
        <div id="add-ex-form-${s.id}" class="add-ex-form" style="display:none;margin-top:9px;padding:12px;background:var(--surface2);border-radius:var(--r)">
          <div style="margin-bottom:8px">
            <span class="lbl">Exercise</span>
            <select id="aes-ex-${s.id}" style="font-size:14px">
              <option value="">Select exercise</option>
              ${EX.map(e => `<option value="${e.id}">${e.name} (${CAT[e.cat]||e.cat})</option>`).join('')}
            </select>
          </div>
          <div style="margin-bottom:8px">
            <span class="lbl">Location</span>
            <select id="aes-loc-${s.id}" style="font-size:14px">
              <option value="gym">Gym</option>
              <option value="home">Home</option>
              <option value="travel">Traveling</option>
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px">
            <div><span class="lbl">Sets</span><input type="number" id="aes-sets-${s.id}" min="1" value="3" style="font-size:14px;padding:7px 9px"></div>
            <div><span class="lbl">Reps</span><input type="number" id="aes-reps-${s.id}" min="1" value="10" style="font-size:14px;padding:7px 9px"></div>
            <div><span class="lbl">Weight</span><input type="number" id="aes-weight-${s.id}" min="0" value="0" style="font-size:14px;padding:7px 9px"></div>
          </div>
          <div style="margin-bottom:8px">
            <span class="lbl">Type</span>
            <select id="aes-type-${s.id}" style="font-size:14px">
              <option value="working">Working set</option>
              <option value="warmup">Warm-up set</option>
            </select>
          </div>
          <div style="display:flex;gap:7px">
            <button class="btn btn-g btn-sm" onclick="addExToSession(${s.id})">&#10003; Save</button>
            <button class="btn btn-sm" onclick="showAddExToSession(${s.id})">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function delSession(id) {
  if (!confirm('Delete this entire session?')) return;
  sessions = sessions.filter(s => s.id !== id);
  save(); renderHistory();
  if (document.getElementById('dash-stats-view').style.display !== 'none') renderDashboard();
}

function editSessionDate(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const newDate = prompt('Enter new date (YYYY-MM-DD):', s.date);
  if (!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate)) { alert('Invalid date format. Use YYYY-MM-DD.'); return; }
  s.date = newDate;
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save(); renderHistory();
}

function delExEntry(sessionId, eIdx) {
  if (!confirm('Remove this exercise from the session?')) return;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== sessionId);
  save(); renderHistory();
}

function delSet(sessionId, eIdx, sIdx) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  s.entries[eIdx].sets.splice(sIdx, 1);
  if (!s.entries[eIdx].sets.length) s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== sessionId);
  save(); renderHistory();
}

function editSet(sessionId, eIdx, sIdx) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const rowId = `set-row-${sessionId}-${eIdx}-${sIdx}`;
  const row = document.getElementById(rowId);
  if (!row) return;
  // Replace row with inline edit form
  const isBilateral = set.eachHand;
  row.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:1">
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Sets</span>
        <input type="number" id="es-sets-${rowId}" value="${set.sets}" min="1" style="font-size:13px;padding:5px 7px;width:100%"></div>
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Reps</span>
        <input type="number" id="es-reps-${rowId}" value="${set.reps}" min="1" style="font-size:13px;padding:5px 7px;width:100%"></div>
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Weight (lbs)</span>
        <input type="number" id="es-weight-${rowId}" value="${set.weight}" min="0" style="font-size:13px;padding:5px 7px;width:100%"></div>
    </div>
    <div style="display:flex;gap:5px;margin-top:6px;flex-shrink:0">
      <button class="btn btn-sm btn-g" onclick="saveEditSet(${sessionId},${eIdx},${sIdx},'${rowId}')">&#10003; Save</button>
      <button class="btn btn-sm" onclick="renderHistory()">Cancel</button>
    </div>`;
}

function saveEditSet(sessionId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const newSets = parseInt(document.getElementById(`es-sets-${rowId}`)?.value) || set.sets;
  const newReps = parseInt(document.getElementById(`es-reps-${rowId}`)?.value) || set.reps;
  const newWeight = parseFloat(document.getElementById(`es-weight-${rowId}`)?.value) || 0;
  set.sets = newSets;
  set.reps = newReps;
  set.weight = newWeight;
  set.totalWeight = set.eachHand ? newWeight * 2 : newWeight;
  save(); renderHistory();
}

// ── ADD TO HISTORY ──────────────────────────────────────────
function showAddPastSession() {
  const el = document.getElementById('add-past-session-form');
  el.style.display = 'block';
  // Default to yesterday
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  document.getElementById('past-ses-date').value = localDate(yesterday);

// ── LINE GRAPH ─────────────────────────────────────────────
function makeLineGraph(points, opts) {
  // points: [{x: date string, y: number, label: string}]
  // opts: {width, height, color, yLabel, xLabel, yFormat}
  if (!points || points.length < 2) return '<div style="font-size:13px;color:var(--text3);text-align:center;padding:16px 0">Log more entries to see your trend</div>';

  const W = 100; // use percentage viewBox
  const H = 60;
  const pad = {top: 6, right: 4, bottom: 20, left: 28};
  const gW = W - pad.left - pad.right;
  const gH = H - pad.top - pad.bottom;

  const ys = points.map(p => p.y);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const rangeY = maxY - minY || 1;

  const color = opts.color || '#534AB7';
  const yFormat = opts.yFormat || (v => v);

  // Normalize points to SVG coords
  const mapped = points.map((p, i) => {
    const x = pad.left + (i / (points.length - 1)) * gW;
    const y = pad.top + gH - ((p.y - minY) / rangeY) * gH;
    return {x, y, raw: p};
  });

  const pathD = mapped.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaD = `${pathD} L ${mapped[mapped.length-1].x.toFixed(1)} ${(pad.top + gH).toFixed(1)} L ${mapped[0].x.toFixed(1)} ${(pad.top + gH).toFixed(1)} Z`;

  // Y axis labels
  const yTicks = [minY, (minY + maxY) / 2, maxY].map((v, i) => {
    const y = pad.top + gH - ((v - minY) / rangeY) * gH;
    return `<text x="${(pad.left - 2).toFixed(1)}" y="${y.toFixed(1)}" font-size="4" fill="#888" text-anchor="end" dominant-baseline="middle">${yFormat(Math.round(v * 10) / 10)}</text>`;
  }).join('');

  // X axis labels — show first, middle, last
  const xIdxs = [0, Math.floor((points.length - 1) / 2), points.length - 1];
  const xLabels = xIdxs.map(i => {
    const p = mapped[i];
    const d = new Date(points[i].x + 'T12:00:00');
    const label = d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
    return `<text x="${p.x.toFixed(1)}" y="${(pad.top + gH + 7).toFixed(1)}" font-size="4" fill="#888" text-anchor="middle">${label}</text>`;
  }).join('');

  // Dots for recent/notable points — last point always shown
  const dots = mapped.slice(-1).map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="${color}"/>`
  ).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;overflow:visible;display:block">
    <defs>
      <linearGradient id="lg-${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <!-- Grid lines -->
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + gH}" stroke="#eee" stroke-width="0.5"/>
    <line x1="${pad.left}" y1="${pad.top + gH}" x2="${pad.left + gW}" y2="${pad.top + gH}" stroke="#eee" stroke-width="0.5"/>
    <line x1="${pad.left}" y1="${(pad.top + gH/2).toFixed(1)}" x2="${pad.left + gW}" y2="${(pad.top + gH/2).toFixed(1)}" stroke="#eee" stroke-width="0.3" stroke-dasharray="1,1"/>
    <!-- Area fill -->
    <path d="${areaD}" fill="url(#lg-${color.replace('#','')})" />
    <!-- Line -->
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Dots -->
    ${dots}
    <!-- Labels -->
    ${yTicks}
    ${xLabels}
  </svg>`;
}

        const restHTML = rest.length ? '<div style="border-top:1px solid var(--border);padding-top:10px">'
          + '<div onclick="toggleAllPRs()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 0">'
          + '<div style="font-size:13px;font-weight:600;color:var(--text2)">All records (' + rest.length + ' more)</div>'
          + '<span id="all-prs-chev" style="font-size:12px;color:var(--text3)">&#9660;</span></div>'
          + '<div id="all-prs-list" style="display:none;margin-top:8px">'
          + rest.map(function(pr) {
              return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">'
                + '<div style="font-size:14px;color:var(--text)">' + pr.name + '</div>'
                + '<div style="text-align:right"><div style="font-size:14px;font-weight:600;color:var(--gold)">' + pr.pr + ' lbs</div>'
                + '<div style="font-size:11px;color:var(--text3)">Last: ' + pr.last + ' lbs</div></div></div>';
            }).join('')
          + '</div></div>' : '';
        return topHTML + restHTML;
      })()}
    </div>` : `<div class="card" style="margin-bottom:12px;text-align:center;padding:20px;color:var(--text3)">
      <div style="font-size:14px;color:var(--text2);line-height:1.6">No weighted exercises logged yet.<br>When you log exercises with a weight greater than 0, your personal bests will appear here.</div>
    </div>`}

    ${(() => {
      const records = getPlankRecords();
      if (!records.length) return '';
      const today = localDate();

      // PR
      const pr = Math.max(...records.map(r => r.secs));

      // This week vs last week best
      const weekStart = new Date(today + 'T12:00:00');
      weekStart.setDate(weekStart.getDate() - weekStart.getDay());
      const weekStartStr = localDate(weekStart);
      const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(lastWeekStart.getDate() - 7);
      const lastWeekStartStr = localDate(lastWeekStart);

      const thisWeekBest = Math.max(0, ...records.filter(r => r.date >= weekStartStr).map(r => r.secs));
      const todayBest = Math.max(0, ...records.filter(r => r.date === today).map(r => r.secs));
      const prDate = records.find(r => r.secs === pr);
      const prDateStr = prDate ? new Date(prDate.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '';

      return '<div class="card" style="margin-bottom:12px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;margin-bottom:14px;color:var(--text)">🏋️ Plank Progress</div>'

        // Top stats row
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'
        + '<div style="background:var(--gold-light);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gold);margin-bottom:2px">PR 🏆</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--gold);line-height:1">' + formatPlankTime(pr) + '</div>'
        + (prDateStr ? '<div style="font-size:10px;color:var(--gold);margin-top:2px;opacity:.8">' + prDateStr + '</div>' : '')
        + '</div>'
        + '<div style="background:var(--surface2);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:2px">This week</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--accent);line-height:1">' + (thisWeekBest ? formatPlankTime(thisWeekBest) : '—') + '</div>'
        + '</div>'
        + '<div style="background:var(--surface2);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:2px">Today</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--accent);line-height:1">' + (todayBest ? formatPlankTime(todayBest) : '—') + '</div>'
        + '</div>'
        + '</div>'

        // Records list
        + '<div style="border-top:1px solid var(--border);padding-top:10px">'
        + '<div onclick="togglePlankRecords()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">'
        + '<div style="font-size:14px;font-weight:600;color:var(--text2)">All records (' + records.length + ')</div>'
        + '<span id="plank-records-chev" style="font-size:12px;color:var(--text3)">&#9660;</span>'
        + '</div>'
        + '<div id="plank-records-list" style="display:none;margin-top:10px">'
        + [...records].reverse().map(r => {
            const rid = r.id || r.date + r.secs;
            return '<div id="plank-rec-' + rid + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'
              + '<div><div style="font-size:15px;font-weight:600;color:var(--text)">' + formatPlankTime(r.secs) + '</div>'
              + '<div style="font-size:12px;color:var(--text3)">' + new Date(r.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) + '</div></div>'
              + '<div style="display:flex;gap:6px">'
              + '<button onclick="editPlankRecord(' + rid + ')" class="btn btn-sm" style="font-size:12px">Edit</button>'
              + '<button onclick="deletePlankRecord(' + rid + ')" class="btn btn-sm" style="font-size:12px;color:var(--danger);border-color:var(--danger)">Delete</button>'
              + '</div></div>';
          }).join('')
        + '</div></div>'
        + '</div>';
    })()}

    <div style="margin-top:12px">
      <button onclick="showHistory()" class="btn" style="width:100%;font-size:16px;padding:14px;color:var(--text2);border-color:var(--border2)">&#128203; View workout history</button>

    <!-- HEALTH TRACKING -->
    ${(() => {
      // Weight data
      const weightData = getWeightData();
      const today = localDate();
      const todayEntry = weightData.find(w => w.date === today);
      const sorted = [...weightData].sort((a,b) => a.date.localeCompare(b.date));
      const recent = sorted.slice(-90);
      const first = sorted[0];
      const last = sorted[sorted.length-1];
      const change = (first && last && first !== last) ? (last.weight - first.weight).toFixed(1) : null;
      const weightPoints = sorted.map(w => ({x: w.date, y: w.weight}));
      const weightGraph = makeLineGraph(weightPoints, {color:'#534AB7', yFormat: v => v + ''});

      // Water data
      const cups = getWaterToday();
      const goal = 8;
      const waterDone = cups >= goal;
      const pct = Math.min(cups / goal * 100, 100);

      // Glucose data
      const glucoseData = getGlucoseData();
      const todayGlucose = glucoseData.filter(g => g.date === today);

      return '<div class="card" style="margin-bottom:12px">'
        + '<div onclick="toggleHealthTracking()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:0">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">🏥 Health Tracking</div>'
        + '<span id="health-tracking-chev" style="font-size:13px;color:var(--text3)">' + (healthTrackingOpen ? '&#9650;' : '&#9660;') + '</span>'
        + '</div>'
        + '<div id="health-tracking-body" style="display:' + (healthTrackingOpen ? 'block' : 'none') + ';margin-top:14px">'

        // WEIGHT
        + '<div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px">'
        + '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px">⚖️ Weight</div>'
        + '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:flex-end">'
        + '<div style="flex:2"><span class="lbl">Weight (lbs)</span>'
        + '<input type="number" id="weight-input" step="0.1" placeholder="e.g. 134.5" value="' + (todayEntry?.weight || '') + '" style="font-size:16px;padding:10px 12px">'
        + '</div>'
        + '<div style="flex:2"><span class="lbl">Date</span>'
        + '<input type="date" id="weight-date-input" value="' + today + '" style="font-size:15px;padding:10px 12px">'
        + '</div>'
        + '<button onclick="logWeight()" class="btn btn-g" style="padding:10px 16px;font-size:15px;margin-bottom:0;flex-shrink:0">Log</button>'
        + '</div>'
        + (change !== null ? '<div style="display:flex;gap:10px;margin-bottom:12px">'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Start</div><div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">' + first.weight + '</div></div>'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Current</div><div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">' + last.weight + '</div></div>'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Change</div><div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:' + (parseFloat(change) < 0 ? '#3B6D11' : parseFloat(change) > 0 ? 'var(--danger)' : 'var(--text)') + '">' + (parseFloat(change) > 0 ? '+' : '') + change + '</div></div>'
          + '</div>' : '')
        + (sorted.length > 0 ? '<div style="margin-bottom:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--r);display:flex;justify-content:space-between;align-items:center">'
          + '<div style="font-size:13px;color:var(--text3)">Today</div>'
          + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--accent)">' + (todayEntry ? todayEntry.weight + ' lbs' : '—') + '</div>'
          + '</div>' : '')
        + (sorted.length > 1 ? '<div style="padding:8px 0">' + weightGraph + '</div>' : sorted.length === 1 ? '<div style="font-size:13px;color:var(--text3);text-align:center;padding:8px 0">Log again tomorrow to see your trend</div>' : '<div style="font-size:13px;color:var(--text3);text-align:center;padding:8px 0">Log your weight to see your trend</div>')
        + (sorted.length ? '<div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px">'
          + '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px">All entries</div>'
          + '<div style="max-height:200px;overflow-y:auto">'
          + [...sorted].reverse().map(function(w) {
              const d = new Date(w.date + 'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
              return '<div id="weight-row-' + w.date + '" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
                + '<div style="flex:1">'
                + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--accent)">' + w.weight + ' <span style="font-size:13px;color:var(--text3)">lbs</span></div>'
                + '<div style="font-size:12px;color:var(--text3)">' + d + '</div>'
                + '</div>'
                + '<div style="display:flex;gap:6px">'
                + '<button onclick="editWeightEntry(\'' + w.date + '\')" class="btn btn-sm" style="font-size:11px">Edit</button>'
                + '<button onclick="deleteWeightEntry(\'' + w.date + '\')" class="btn btn-sm" style="font-size:11px;color:var(--danger);border-color:var(--danger)">Del</button>'
                + '</div></div>';
            }).join('')
          + '</div></div>' : '')
        + '</div>'

        // WATER
        + '<div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px">'
        + '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px">💧 Water</div>'
        + (waterDone ? '<div style="background:linear-gradient(135deg,#4d96ff,#00e5ff);border-radius:var(--r);padding:10px;text-align:center;margin-bottom:10px"><div style="font-weight:800;color:#fff;font-size:16px">💧 Goal reached! 💧</div></div>' : '')
        + '<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:40px;color:var(--accent);line-height:1">' + cups + '</div>'
        + '<div style="flex:1"><div style="font-size:14px;color:#333;margin-bottom:6px">of ' + goal + ' cups today</div>'
        + '<div style="background:var(--surface2);border-radius:20px;height:10px;overflow:hidden"><div style="background:linear-gradient(90deg,#4d96ff,#00e5ff);height:100%;width:' + pct + '%;border-radius:20px"></div></div></div>'
        + '</div>'
        + '<div style="display:flex;gap:8px">'
        + '<button onclick="addWaterCup()" class="btn btn-g" style="flex:2;font-size:15px;padding:10px">+ 1 cup</button>'
        + '<button onclick="removeWaterCup()" class="btn" style="flex:1;font-size:15px;padding:10px;color:var(--text3)"' + (cups === 0 ? ' disabled' : '') + '>- 1</button>'
        + '<button onclick="resetWater()" class="btn" style="flex:1;font-size:13px;padding:10px;color:var(--text3)">Reset</button>'
        + '</div></div>'

        // GLUCOSE
        + '<div style="border-top:1px solid var(--border);padding-top:14px">'
        + '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px">🩸 Glucose</div>'
        + '<div style="font-size:11px;color:var(--text3);margin-bottom:10px">Normal: Fasting 70–100 · Post-meal &lt;140 mg/dL</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'
        + '<div><span class="lbl">Reading (mg/dL)</span><input type="number" id="glucose-input" min="0" max="600" placeholder="e.g. 95" style="font-size:16px;padding:10px 12px"></div>'
        + '<div><span class="lbl">Context</span><select id="glucose-context" style="font-size:15px"><option value="fasting">Fasting</option><option value="before_meal">Before meal</option><option value="after_meal">After meal</option><option value="bedtime">Bedtime</option><option value="other">Other</option></select></div>'
        + '</div>'
        + '<div style="margin-bottom:10px"><span class="lbl">Notes (optional)</span><input type="text" id="glucose-notes" placeholder="e.g. had fries, skipped breakfast..." style="font-size:15px;padding:10px 12px"></div>'
        + '<button onclick="logGlucose()" class="btn btn-g" style="width:100%;font-size:15px;padding:10px;margin-bottom:14px">Log reading</button>'
        + (glucoseData.length > 1 ? '<div style="padding:8px 0 12px">' + makeLineGraph(
            [...glucoseData].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)).map(g => ({x: g.date, y: g.value})),
            {color:'#dc2626', yFormat: v => v + ''}
          ) + '</div>' : '')
        + (glucoseData.length ? '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px">All readings</div>'
          + '<div style="max-height:300px;overflow-y:auto">'
          + [...glucoseData].reverse().map(function(g) {
              const contextLabels = {fasting:'Fasting',before_meal:'Before meal',after_meal:'After meal',bedtime:'Bedtime',other:'Other'};
              const isFasting = g.context === 'fasting';
              const isAfterMeal = g.context === 'after_meal';
              let color = '#3B6D11'; let bg = '#f0faf0'; let label = 'Normal';
              if (isFasting) {
                if (g.value > 125) { color = '#dc2626'; bg = '#fef2f2'; label = 'High'; }
                else if (g.value > 100) { color = '#d97706'; bg = '#fffbeb'; label = 'Borderline'; }
              } else if (isAfterMeal) {
                if (g.value > 180) { color = '#dc2626'; bg = '#fef2f2'; label = 'High'; }
                else if (g.value > 140) { color = '#d97706'; bg = '#fffbeb'; label = 'Borderline'; }
              } else {
                if (g.value > 140) { color = '#dc2626'; bg = '#fef2f2'; label = 'High'; }
                else if (g.value > 100) { color = '#d97706'; bg = '#fffbeb'; label = 'Check'; }
              }
              return '<div id="glucose-row-' + g.id + '" style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">'
                + '<div style="background:' + bg + ';border-radius:var(--r);padding:6px 10px;text-align:center;min-width:60px">'
                + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:' + color + ';line-height:1">' + g.value + '</div>'
                + '<div style="font-size:10px;font-weight:700;color:' + color + '">' + label + '</div>'
                + '</div>'
                + '<div style="flex:1">'
                + '<div style="font-size:14px;font-weight:600;color:#111">' + (contextLabels[g.context]||g.context) + '</div>'
                + '<div style="font-size:12px;color:var(--text3)">' + new Date(g.date + 'T' + g.time).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) + '</div>'
                + (g.notes ? '<div style="font-size:12px;color:#7a5c00;background:#fffbeb;border-left:3px solid #f59e0b;padding:3px 8px;border-radius:0 4px 4px 0;margin-top:3px">📝 ' + g.notes + '</div>' : '')
                + '</div>'
                + '<div style="display:flex;flex-direction:column;gap:4px">'
                + '<button onclick="editGlucose(' + g.id + ')" class="btn btn-sm" style="font-size:11px">Edit</button>'
                + '<button onclick="deleteGlucose(' + g.id + ')" class="btn btn-sm" style="font-size:11px;color:var(--danger);border-color:var(--danger)">Del</button>'
                + '</div></div>';
            }).join('')
          + '</div>' : '<div style="font-size:13px;color:var(--text3);text-align:center;padding:10px 0">No readings logged yet</div>')
        + '</div>'

        + '</div></div>';
    })()}
    </div>
    `}
  `;

  if (!sessions.length) return;
}


</script>
</body>
</html>
