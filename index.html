        return topHTML + restHTML;
      })()}
    </div>` : `<div class="card" style="margin-bottom:12px;text-align:center;padding:20px;color:var(--text3)">
      <div style="font-size:14px;color:var(--text2);line-height:1.6">No weighted exercises logged yet.<br>When you log exercises with a weight greater than 0, your personal bests will appear here.</div>
    </div>`}

    ${(() => {
      const records = getPlankRecords();
      if (!records.length) return '';
      const today = localDate();

      // PR
      const pr = Math.max(...records.map(r => r.secs));

      // This week vs last week best
      const weekStart = new Date(today + 'T12:00:00');
      weekStart.setDate(weekStart.getDate() - weekStart.getDay());
      const weekStartStr = localDate(weekStart);
      const lastWeekStart = new Date(weekStart); lastWeekStart.setDate(lastWeekStart.getDate() - 7);
      const lastWeekStartStr = localDate(lastWeekStart);

      const thisWeekBest = Math.max(0, ...records.filter(r => r.date >= weekStartStr).map(r => r.secs));
      const lastWeekBest = Math.max(0, ...records.filter(r => r.date >= lastWeekStartStr && r.date < weekStartStr).map(r => r.secs));

      // This month total
      const monthStart = today.substring(0, 7);
      const monthTotal = records.filter(r => r.date.startsWith(monthStart)).reduce((sum, r) => sum + r.secs, 0);

      // Last 7 days
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today + 'T12:00:00');
        d.setDate(d.getDate() - i);
        const ds = localDate(d);
        const dayRecords = records.filter(r => r.date === ds);
        const best = dayRecords.length ? Math.max(...dayRecords.map(r => r.secs)) : 0;
        last7.push({date: ds, secs: best, label: d.toLocaleDateString(undefined,{weekday:'short'})});
      }
      const maxSecs = Math.max(...last7.map(d => d.secs), 1);

      const weekCompare = lastWeekBest > 0
        ? (thisWeekBest > lastWeekBest ? '📈 Up from ' + formatPlankTime(lastWeekBest) + ' last week' :
           thisWeekBest < lastWeekBest ? '📉 Down from ' + formatPlankTime(lastWeekBest) + ' last week' :
           '➡️ Same as last week')
        : 'First week of tracking';

      return '<div class="card" style="margin-bottom:12px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;margin-bottom:14px;color:var(--text)">🏋️ Plank Progress</div>'

        // Top stats row
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'
        + '<div style="background:var(--gold-light);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gold);margin-bottom:2px">PR</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--gold);line-height:1">' + formatPlankTime(pr) + '</div>'
        + '</div>'
        + '<div style="background:var(--surface2);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:2px">This week</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--accent);line-height:1">' + (thisWeekBest ? formatPlankTime(thisWeekBest) : '—') + '</div>'
        + '</div>'
        + '<div style="background:var(--surface2);border-radius:var(--r);padding:10px;text-align:center">'
        + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:2px">Month total</div>'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:22px;color:var(--accent);line-height:1">' + formatPlankTime(monthTotal) + '</div>'
        + '</div>'
        + '</div>'

        // Week comparison
        + '<div style="font-size:14px;color:var(--text2);margin-bottom:14px;font-weight:500">' + weekCompare + '</div>'

        // Last 7 days bar chart
        + '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px">Last 7 days</div>'
        + '<div style="display:flex;gap:4px;align-items:flex-end;height:60px;margin-bottom:4px">'
        + last7.map(d => {
            const h = d.secs ? Math.max(8, Math.round((d.secs / maxSecs) * 52)) : 4;
            const isToday = d.date === today;
            const color = isToday ? 'var(--accent)' : d.secs ? 'rgba(83,74,183,0.4)' : 'var(--border)';
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">'
              + '<div style="font-size:10px;color:var(--text3);margin-bottom:2px">' + (d.secs ? formatPlankTime(d.secs) : '') + '</div>'
              + '<div style="width:100%;background:' + color + ';border-radius:3px 3px 0 0;height:' + h + 'px"></div>'
              + '</div>';
          }).join('')
        + '</div>'
        + '<div style="display:flex;gap:4px">'
        + last7.map(d => '<div style="flex:1;text-align:center;font-size:11px;color:' + (d.date === today ? 'var(--accent)' : 'var(--text3)') + ';font-weight:' + (d.date === today ? '700' : '400') + '">' + d.label + '</div>').join('')
        // Records list
        + '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:10px">'
        + '<div onclick="togglePlankRecords()" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">'
        + '<div style="font-size:14px;font-weight:600;color:var(--text2)">All records (' + records.length + ')</div>'
        + '<span id="plank-records-chev" style="font-size:12px;color:var(--text3)">&#9660;</span>'
        + '</div>'
        + '<div id="plank-records-list" style="display:none;margin-top:10px">'
        + [...records].reverse().map(r => {
            const rid = r.id || r.date + r.secs;
            return '<div id="plank-rec-' + rid + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">'
              + '<div><div style="font-size:15px;font-weight:600;color:var(--text)">' + formatPlankTime(r.secs) + '</div>'
              + '<div style="font-size:12px;color:var(--text3)">' + new Date(r.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) + '</div></div>'
              + '<div style="display:flex;gap:6px">'
              + '<button onclick="editPlankRecord(' + rid + ')" class="btn btn-sm" style="font-size:12px">Edit</button>'
              + '<button onclick="deletePlankRecord(' + rid + ')" class="btn btn-sm" style="font-size:12px;color:var(--danger);border-color:var(--danger)">Delete</button>'
              + '</div></div>';
          }).join('')
        + '</div></div>'
        + '</div>';
    })()}

    <div style="margin-top:12px">
      <button onclick="showHistory()" class="btn" style="width:100%;font-size:16px;padding:14px;color:var(--text2);border-color:var(--border2)">&#128203; View workout history</button>

    <!-- WEIGHT TRACKER -->
    ${(() => {
      const weightData = getWeightData();
      const today = localDate();
      const todayEntry = weightData.find(w => w.date === today);
      const sorted = [...weightData].sort((a,b) => a.date.localeCompare(b.date));
      const recent = sorted.slice(-90);
      const first = sorted[0];
      const last = sorted[sorted.length-1];
      const change = (first && last && first !== last) ? (last.weight - first.weight).toFixed(1) : null;

      const bars = recent.length > 1 ? (() => {
        const min = Math.min(...recent.map(w => w.weight));
        const max = Math.max(...recent.map(w => w.weight));
        const range = max - min || 1;
        const step = Math.max(1, Math.floor(recent.length / 60));
        const pts = recent.filter((_,i) => i % step === 0 || i === recent.length-1);
        return '<svg width="100%" height="80" style="overflow:visible">'
          + '<polyline points="' + pts.map((w,i) => {
              const x = (i / (pts.length-1)) * 100;
              const y = 75 - ((w.weight - min) / range) * 65;
              return x + '% ' + y;
            }).join(' ') + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>'
          + pts.map((w,i) => {
              const x = (i / (pts.length-1)) * 100;
              const y = 75 - ((w.weight - min) / range) * 65;
              return '<circle cx="' + x + '%" cy="' + y + '" r="3" fill="var(--accent)"/>';
            }).join('')
          + '<text x="0" y="78" font-size="10" fill="var(--text3)" font-family="DM Sans">' + min + ' lbs</text>'
          + '<text x="100%" y="78" font-size="10" fill="var(--text3)" font-family="DM Sans" text-anchor="end">' + max + ' lbs</text>'
          + '</svg>';
      })() : '';

      return '<div class="card" style="margin-bottom:12px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;margin-bottom:12px;color:var(--text)">⚖️ Weight</div>'
        + '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:flex-end">'
        + '<div style="flex:1"><span class="lbl">Today\'s weight (lbs)</span>'
        + '<input type="number" id="weight-input" step="0.1" placeholder="e.g. 134.5" value="' + (todayEntry?.weight || '') + '" style="font-size:16px;padding:10px 12px">'
        + '</div>'
        + '<button onclick="logWeight()" class="btn btn-g" style="padding:10px 16px;font-size:15px;margin-bottom:0">Log</button>'
        + '</div>'
        + (change !== null ? '<div style="display:flex;gap:10px;margin-bottom:12px">'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center">'
          + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Start</div>'
          + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">' + first.weight + '</div>'
          + '</div>'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center">'
          + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Current</div>'
          + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:var(--text)">' + last.weight + '</div>'
          + '</div>'
          + '<div style="background:var(--surface2);border-radius:var(--r);padding:8px 12px;flex:1;text-align:center">'
          + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3)">Change</div>'
          + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;color:' + (parseFloat(change) < 0 ? '#3B6D11' : parseFloat(change) > 0 ? 'var(--danger)' : 'var(--text)') + '">' + (parseFloat(change) > 0 ? '+' : '') + change + '</div>'
          + '</div>'
          + '</div>' : '')
        + (bars ? '<div style="padding:4px 0">' + bars + '</div>' : '<div style="font-size:13px;color:var(--text3);text-align:center;padding:10px 0">Log your weight to see your trend</div>')
        + '</div>';
    })()}

    <!-- WATER TRACKER -->
    ${(() => {
      const cups = getWaterToday();
      const goal = 8;
      const done = cups >= goal;
      const pct = Math.min(cups / goal * 100, 100);
      return '<div class="card" style="margin-bottom:12px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:20px;margin-bottom:12px;color:var(--text)">💧 Water</div>'
        + (done ? '<div style="background:linear-gradient(135deg,#4d96ff,#00e5ff);border-radius:var(--r);padding:12px;text-align:center;margin-bottom:12px">'
          + '<div style="font-family:\'DM Sans\',sans-serif;font-size:20px;font-weight:800;color:#fff;text-transform:uppercase">💧 Goal reached! 💧</div>'
          + '<div style="font-size:13px;color:rgba(255,255,255,.85);margin-top:3px">You drank ' + cups + ' cups today</div>'
          + '</div>' : '')
        + '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">'
        + '<div style="font-family:\'DM Serif Display\',serif;font-size:40px;color:var(--accent);line-height:1">' + cups + '</div>'
        + '<div style="flex:1">'
        + '<div style="font-size:14px;color:#333;margin-bottom:6px">of ' + goal + ' cups today</div>'
        + '<div style="background:var(--surface2);border-radius:20px;height:10px;overflow:hidden">'
        + '<div style="background:linear-gradient(90deg,#4d96ff,#00e5ff);height:100%;width:' + pct + '%;border-radius:20px;transition:width .3s"></div>'
        + '</div>'
        + '</div>'
        + '</div>'
        + '<div style="display:flex;gap:8px">'
        + '<button onclick="addWaterCup()" class="btn btn-g" style="flex:2;font-size:15px;padding:10px">+ 1 cup</button>'
        + '<button onclick="removeWaterCup()" class="btn" style="flex:1;font-size:15px;padding:10px;color:var(--text3)" ' + (cups === 0 ? 'disabled' : '') + '>- 1</button>'
        + '<button onclick="resetWater()" class="btn" style="flex:1;font-size:13px;padding:10px;color:var(--text3)">Reset</button>'
        + '</div>'
        + '</div>';
    })()}
    </div>
    `}
  `;

  if (!sessions.length) return;
}


</script>
</body>
</html>
