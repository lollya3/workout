<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f7f5f0; --surface:#fff; --surface2:#f0ede6;
  --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.15);
  --text:#111; --text2:#333; --text3:#555;
  --accent:#534AB7; --alight:#EEEDFE;
  --gold:#D85A30; --gold-light:#FAECE7;
  --danger:#c0392b; --warn:#b8860b; --warn-light:#fdf8e4;
  --gym-c:#1a3a5c; --gym-bg:#e8f0f8;
  --home-c:#534AB7; --home-bg:#EEEDFE;
  --travel-c:#7a4f1a; --travel-bg:#faf0e4;
  --bal-c:#1a5c5a; --bal-bg:#e8f8f7;
  --mob-c:#5a2d7a; --mob-bg:#f0e8f8;
  --r:10px; --rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:20px}
h1,h2,h3{font-family:'DM Serif Display',serif}
nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:700px;margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:flex-start;gap:0}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);padding:15px 0;margin-right:auto;white-space:nowrap}
.nt{padding:10px 14px;font-size:12px;font-weight:600;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1}
.nt.on{color:var(--accent);border-bottom-color:var(--accent)}
@media(max-width:380px){.nt{padding:9px 10px;font-size:11px}.logo{font-size:17px}}
.page{display:none;max-width:700px;margin:0 auto;padding:16px 14px 80px}
.page.on{display:block}
.card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;margin-bottom:13px;box-shadow:var(--sh)}
.ctitle{font-family:'DM Serif Display',serif;font-size:21px;margin-bottom:13px;color:var(--text)}
.lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px;display:block}
input,select{font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
.btn{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;padding:11px 18px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-g{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-g:hover{background:#234a31}
.btn-sm{font-size:13px;padding:7px 14px;border-radius:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.gym{background:var(--gym-bg);color:var(--gym-c);border-color:var(--gym-c)}
.chip.home{background:var(--home-bg);color:var(--home-c);border-color:var(--home-c)}
.chip.travel{background:var(--travel-bg);color:var(--travel-c);border-color:var(--travel-c)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-bottom:13px}
.ec{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ec.sel{border:2px solid var(--accent)}
.ec.exp{grid-column:1/-1}
.ec-hd{padding:12px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
.ec-hd:hover .ec-nm{color:var(--accent)}
.ec-nm{font-size:16px;font-weight:600;color:var(--text);line-height:1.3}
.ec-sub{font-size:13px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.chev{font-size:13px;color:var(--text3);flex-shrink:0;margin-top:2px;transition:transform .2s}
.ec.exp .chev{transform:rotate(180deg)}
.ec-dt{display:none;border-top:1px solid var(--border);padding:14px}
.ec.exp .ec-dt{display:block}
.ec-inner{display:grid;grid-template-columns:105px 1fr;gap:13px;align-items:start}
@media(max-width:360px){.ec-inner{grid-template-columns:1fr}}
.di-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:3px}
.di-val{font-size:14px;color:var(--text);line-height:1.5}
.di-tip{font-size:14px;color:var(--warn);line-height:1.5}
.di-row{margin-bottom:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:9px}
.pill-gym{background:var(--gym-bg);color:var(--gym-c)}
.pill-home{background:var(--home-bg);color:var(--home-c)}
.pill-travel{background:var(--travel-bg);color:var(--travel-c)}
.pill-balance{background:var(--bal-bg);color:var(--bal-c)}
.pill-mobility{background:var(--mob-bg);color:var(--mob-c)}
.sec-tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:inline-block;padding:3px 10px;border-radius:9px;margin-bottom:10px}
.tag-wu{background:var(--warn-light);color:var(--warn)}
.tag-main{background:var(--alight);color:var(--accent)}
.tag-str{background:var(--gym-bg);color:var(--gym-c)}
.tag-bal{background:var(--bal-bg);color:var(--bal-c)}
.stype-row{display:flex;gap:7px;margin-bottom:10px}
.stype{font-size:14px;padding:7px 16px;border-radius:20px;border:1px solid var(--border2);background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;font-weight:500}
.stype.on{background:var(--surface2);color:var(--text);font-weight:600}
.sf-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:9px}
@media(max-width:360px){.sf-row{grid-template-columns:1fr 1fr}.sf-row .btn{grid-column:1/-1}}
.set-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sc{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-radius:8px;font-size:14px}
.sc.working{background:var(--surface2);color:var(--text)}
.sc.warmup{background:var(--warn-light);color:var(--warn)}
.del-btn{border:none;background:none;cursor:pointer;font-size:17px;color:inherit;opacity:.4;padding:0 2px;line-height:1}
.del-btn:hover{opacity:1}
.hc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:11px;box-shadow:var(--sh)}
.hc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.he{padding:7px 0;border-bottom:1px solid var(--border);font-size:15px}
.he:last-child{border-bottom:none}
.he-nm{font-weight:600;margin-bottom:2px}
.he-sets{font-size:13px;color:var(--text2)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.sc2{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;text-align:center;box-shadow:var(--sh)}
.sn{font-family:'DM Serif Display',serif;font-size:30px;color:var(--accent);line-height:1;margin-bottom:4px}
.sl{font-size:13px;color:var(--text2);font-weight:500}
.pr-list{display:flex;flex-direction:column}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
.pr-row:last-child{border-bottom:none}
.pr-val{font-weight:600;color:var(--gold)}
.cw{position:relative;width:100%;height:220px;margin-bottom:5px}
.tog-g{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.tog{padding:9px 15px;font-size:15px;border:none;background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;font-weight:500}
.tog.on{background:var(--accent);color:#fff}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:16px}
.streak-banner{background:linear-gradient(135deg,var(--accent) 0%,#3C3489 100%);color:#fff;border-radius:var(--rl);padding:17px;margin-bottom:13px;display:flex;align-items:center;gap:14px}
.sb-text h2{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:2px}
.sb-text p{font-size:14px;opacity:.85}
.coach-hero{background:linear-gradient(135deg,#3C3489 0%,#26215C 100%);border-radius:var(--rl);padding:17px;margin-bottom:15px;color:#fff}
.coach-hero h2{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:4px}
.coach-hero p{font-size:15px;opacity:.85;line-height:1.5}
.qa-card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;margin-bottom:13px;box-shadow:var(--sh)}
.qa-q{font-size:18px;font-weight:600;margin-bottom:14px;color:var(--text)}
.qa-opts{display:flex;flex-direction:column;gap:9px}
.qa-opt{font-family:'DM Sans',sans-serif;font-size:16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.qa-opt:hover{border-color:var(--accent);background:var(--alight)}
.qa-prev{margin-bottom:12px}
.qa-pr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)}
.qa-pr:last-child{border-bottom:none}
.qa-pq{color:var(--text3)}
.qa-pa{color:var(--accent);font-weight:500}
.prog-bar{background:var(--surface2);border-radius:20px;height:5px;margin-bottom:14px;overflow:hidden}
.prog-fill{background:var(--accent);height:5px;border-radius:20px;transition:width .3s}
.plan-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:11px;box-shadow:var(--sh)}
.plan-row{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.plan-row:last-of-type{border-bottom:none}
.plan-info{flex:1}
.plan-nm{font-size:16px;font-weight:600;color:var(--text)}
.plan-sr{font-size:14px;color:var(--text2);margin-top:2px}
.plan-tip{font-size:13px;color:var(--warn);margin-top:3px;font-style:italic}
.swap-btn{font-size:13px;padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
.action-menu{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:9px;margin:6px 0;display:flex;gap:8px;flex-wrap:wrap}
.action-item{font-size:14px;padding:7px 15px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;white-space:nowrap}
.action-item:hover{border-color:var(--accent);color:var(--accent)}
.action-delete{color:var(--danger);border-color:var(--danger)}
.action-delete:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.add-ex-btn{font-size:14px;padding:8px 15px;border-radius:20px;border:1px dashed var(--border2);background:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;display:block;width:100%;text-align:center}
.add-ex-btn:hover{border-color:var(--accent);color:var(--accent)}
.swap-panel{background:var(--surface2);border-radius:var(--r);padding:12px;margin:6px 0;border:1px solid var(--border2)}
.swap-ttl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:8px}
.swap-opt{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.swap-opt:hover{border-color:var(--accent)}
.swap-nm{font-size:15px;font-weight:500}
.swap-meta{font-size:13px;color:var(--text3)}
.browse-link{font-size:14px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;padding:4px 0;text-decoration:underline}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto;padding:18px 14px}
.modal-bg.on{display:block}
.modal-inner{background:var(--surface);border-radius:var(--rl);max-width:500px;margin:0 auto;padding:20px}
.modal-close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2);line-height:1}
.br-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.br-row:hover .br-nm{color:var(--accent)}
.br-row:last-child{border-bottom:none}
.star-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:2px 4px;line-height:1;opacity:.35;transition:opacity .15s}
.star-btn.on{opacity:1}
.star-btn:hover{opacity:.75}
.motiv-card{border-radius:var(--rl);padding:28px 22px;margin-bottom:14px;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.motiv-quote{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.35;margin-bottom:14px;position:relative;z-index:1}
.motiv-attr{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75;position:relative;z-index:1}
.motiv-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:14px;position:relative;z-index:1}
.motiv-tip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:28px 24px;margin-bottom:14px;box-shadow:var(--sh)}
.motiv-tip-icon{font-size:40px;margin-bottom:14px}
.motiv-tip-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:12px;color:var(--text)}
.motiv-tip-body{font-size:19px;color:var(--text2);line-height:1.7}
.motiv-refresh{display:flex;justify-content:center;margin-top:6px}

</style>
</head>

<script>

};
const LOC = {gym:'Gym', home:'Home', travel:'Traveling'};
const CATS = Object.keys(CAT);

function svg(body) {
  return '<svg width="100" height="54" viewBox="0 0 110 56">' + body + '</svg>';
}
const head = (cx,cy) => `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="9" fill="#d4cfc8"/>`;
const floor = (y) => `<line x1="4" y1="${y}" x2="106" y2="${y}" stroke="#9FC8A8" stroke-width="3"/>`;
const bar = (x1,y1,x2,y2,c='#9FC8A8') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2"/>`;
const band = (d) => `<path d="${d}" stroke="#c17f3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>`;
const db = (cx,cy) => `<circle cx="${cx}" cy="${cy}" r="4" fill="#534AB7"/>`;
const wt = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#534AB7"/>`;
const wt2 = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#3C3489"/>`;

const EX = [
// CHEST
{id:'bench',name:'Bench press',cat:'chest',loc:['gym'],

function localDate(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function calcStreakFor(activeDateSet) {
  const today = localDate();
  const sorted = [...activeDateSet].sort().reverse();
  let streak = 0;
  let cur = new Date(today + 'T12:00:00');
  for (const d of sorted) {
    if (d === localDate(cur)) { streak++; cur.setDate(cur.getDate()-1); }
    else if (d < localDate(cur)) break;
  }
  return streak;
}

function getWorkoutDates() {
  return new Set(sessions.filter(s => s.entries.length > 0).map(s => s.date));
}

function getDailyDates() {
  const dates = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('wt-daily-checked-')) {
      const dateStr = key.replace('wt-daily-checked-', '');
      try {
        const checked = JSON.parse(localStorage.getItem(key) || '[]');
        const list = JSON.parse(localStorage.getItem('wt-daily-list') || '[]');
        if (checked.length >= (list.length || 12)) dates.add(dateStr);
      } catch(e) {}
    }
  }
  return dates;
}

function getGoalDates() {
  const dates = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('wt-goal-done-')) {
      const dateStr = key.replace('wt-goal-done-', '');
      const goalKey = 'wt-goal-' + dateStr;
      const goalText = localStorage.getItem(goalKey);
      if (goalText && goalText.trim()) dates.add(dateStr);
    }
  }
  return dates;
}

function getTripleCrownDates() {
  const workout = getWorkoutDates();
  const daily = getDailyDates();
  const goal = getGoalDates();
  const all = new Set();
  workout.forEach(d => { if (daily.has(d) && goal.has(d)) all.add(d); });
  return all;
}

function calcStreak() {
  // Default streak = workout OR daily dozen (for backward compat)
  const combined = new Set([...getWorkoutDates(), ...getDailyDates()]);
  return calcStreakFor(combined);
}

function save() { localStorage.setItem('wt-sessions', JSON.stringify(sessions)); }

// ── MIGRATE: merge sessions by date, move location to entries ──
function migrateSessions() {
  let changed = false;
  // Merge any sessions with same date
  const byDate = {};
  sessions.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = {id: s.id, date: s.date, entries: []};
    // Move location onto each entry if not already there
    s.entries.forEach(e => {
      if (!e.location) { e.location = s.location || 'gym'; changed = true; }
      byDate[s.date].entries.push(e);
    });
    if (s.location) changed = true; // will remove it
  });
  const merged = Object.values(byDate);
  if (merged.length !== sessions.length || changed) {
    sessions = merged;
    sessions.sort((a,b) => b.date.localeCompare(a.date));
    save();
  }
}

function renderFavGrid() {
  const grid = document.getElementById('fav-grid');
  if (!grid) return;
  const query = (document.getElementById('ex-search')?.value || '').toLowerCase().trim();

  let allEx = EX;
  if (query) {
    // Search by name, category, or targets
    allEx = EX.filter(e =>
      e.name.toLowerCase().includes(query) ||
      (CAT[e.cat]||e.cat).toLowerCase().includes(query) ||
      (e.targets||'').toLowerCase().includes(query)
    );
  }

  const favEx = allEx.filter(e => favorites.has(e.id));
  const otherEx = allEx.filter(e => !favorites.has(e.id));

  let html = '';

  if (query) {
    // In search mode, just show flat results with a count
    if (!allEx.length) {
      html = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:14px">No exercises match "${query}"</div>`;
    } else {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">${allEx.length} result${allEx.length!==1?'s':''}</div>`;
      html += allEx.map(e => exCardHTML(e)).join('');
    }
  } else {
    // Normal mode: favorites first, then all others
    if (favEx.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">⭐ Favorites</div>`;
      html += favEx.map(e => exCardHTML(e)).join('');
    }
    if (otherEx.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:${favEx.length?'16px':'0'};margin-bottom:8px">All exercises</div>`;
      html += otherEx.map(e => exCardHTML(e)).join('');
    }
    if (!favEx.length && !otherEx.length) {
      html = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:14px">No exercises found.</div>`;
    }
  }

  grid.innerHTML = html;
}

function exCardHTML(e) {
  const isExp = expId === e.id, isSel = selId === e.id;
  const isFav = favorites.has(e.id);
  const pills = e.loc.map(l => `<span class="pill pill-${l}">${LOC[l]}</span>`).join('');
  return `<div class="ec${isSel?' sel':''}${isExp?' exp':''}" id="ec-${e.id}" style="margin-bottom:8px">
    <div class="ec-hd" onclick="toggleCard('${e.id}')">
      <div style="flex:1">

function toggleTodayNote(eIdx) {
  const area = document.getElementById('note-edit-area-' + eIdx);
  if (!area) return;
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function saveTodayNote(exId, eIdx) {
  const val = document.getElementById('note-edit-' + eIdx)?.value.trim();
  if (val !== undefined) saveExNote(exId, val);
  renderTodayCard();
}

function toggleSessionNote(eIdx) {
  const area = document.getElementById('session-note-edit-area-' + eIdx);
  if (!area) return;
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function saveSessionNote(sesId, eIdx) {
  const id = parseInt(sesId);
  const s = sessions.find(x => x.id === id);
  if (!s || !s.entries[eIdx]) return;
  const val = document.getElementById('session-note-edit-' + eIdx)?.value.trim() || '';
  s.entries[eIdx].sessionNote = val;
  save();
  renderTodayCard();
}

function deleteTodaySet(sesId, eIdx, sIdx) {
  const id = parseInt(sesId);
  const s = sessions.find(x => x.id === id);
  if (!s || !s.entries[eIdx]) return;
  s.entries[eIdx].sets.splice(sIdx, 1);
  if (!s.entries[eIdx].sets.length) s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== id);
  save();
  renderTodayCard();
}

function deleteTodayEntry(sesId, eIdx) {
  const id = parseInt(sesId);
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== id);
  save();
  renderTodayCard();
}

function editTodaySet(sesId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === parseInt(sesId));
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const row = document.getElementById(rowId);
  if (!row) return;
  row.innerHTML = `
    <div style="display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-sets-${rowId}" value="${set.sets}" min="1" style="width:52px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">sets</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-reps-${rowId}" value="${set.reps}" min="1" style="width:52px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">reps</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-weight-${rowId}" value="${set.weight}" min="0" style="width:60px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">lbs</span>
      </div>
    </div>
    <div style="display:flex;gap:5px">
      <button class="btn btn-sm btn-g" onclick="saveTodaySet('${sesId}',${eIdx},${sIdx},'${rowId}')">✓</button>
      <button class="btn btn-sm" onclick="renderTodayCard()">✕</button>
    </div>`;
}

function saveTodaySet(sesId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === parseInt(sesId));
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  set.sets = parseInt(document.getElementById(`ts-sets-${rowId}`)?.value) || set.sets;
  set.reps = parseInt(document.getElementById(`ts-reps-${rowId}`)?.value) || set.reps;
  set.weight = parseFloat(document.getElementById(`ts-weight-${rowId}`)?.value) || 0;
  set.totalWeight = set.eachHand ? set.weight * 2 : set.weight;
  save();
  renderTodayCard();
}

function toggleCard(id) {
  expId = expId === id ? null : id;
  renderFavGrid();
  // refresh browse all if open
  if (document.getElementById('browse-all-modal').classList.contains('on')) renderBrowseAll();
}

// ── BROWSE ALL MODAL ───────────────────────────────────────
function openBrowseAll() {
  document.getElementById('browse-all-modal').classList.add('on');
  renderBrowseAll();
}
function closeBrowseAll() {
  document.getElementById('browse-all-modal').classList.remove('on');
  renderFavGrid();
}

function renderBrowseAll() {
  const locF = document.getElementById('ba-loc').value;
  const catF = document.getElementById('ba-cat').value;
  const filtered = EX.filter(e => {
    if (catF !== 'all' && e.cat !== catF) return false;
    if (locF !== 'all' && !e.loc.includes(locF)) return false;
    return true;
  });
  const list = document.getElementById('browse-all-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty">No exercises match.</div>'; return; }
  list.innerHTML = filtered.map(e => {
    const isFav = favorites.has(e.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:15px;font-weight:500;color:var(--text)">${e.name}</div>
        <div style="font-size:12px;color:var(--text3)">${CAT[e.cat]||e.cat} &middot; ${e.loc.map(l=>LOC[l]).join(', ')}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        <button class="star-btn${isFav?' on':''}" onclick="toggleFavFromBrowse('${e.id}')" title="${isFav?'Remove from My exercises':'Add to My exercises'}">&#11088;</button>
        <button class="btn btn-sm" onclick="selectExFromBrowse('${e.id}')">Select</button>
      </div>
    </div>`;
  }).join('');
}

function toggleFavFromBrowse(id) {
  if (favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites();
  renderBrowseAll();
}

function selectExFromBrowse(id) {
  closeBrowseAll();
  selectEx(id);
}

// ── CUSTOM EXERCISES ───────────────────────────────────────
function addCustomEx() {
  const name = document.getElementById('cx-name').value.trim();
  if (!name) { document.getElementById('cx-status').textContent = 'Please enter a name.'; return; }
  const cat = document.getElementById('cx-cat').value;
  const locStr = document.getElementById('cx-loc').value;
  const loc = locStr.split(',');
  const id = 'custom_' + Date.now();
  const ex = {id, name, cat, loc, custom:true, desc:'Custom exercise', targets:'', tip:'', svg:''};
  customEx.push(ex);
  EX.push(ex);
  favorites.add(id);
  saveCustomEx();
  saveFavorites();
  document.getElementById('cx-name').value = '';
  document.getElementById('cx-status').textContent = `"${name}" added to My exercises!`;
  setTimeout(() => document.getElementById('cx-status').textContent = '', 3000);
  renderBrowseAll();
}

function deleteCustomEx(id) {
  if (!confirm('Delete this custom exercise?')) return;
  customEx = customEx.filter(e => e.id !== id);
  const idx = EX.findIndex(e => e.id === id);
  if (idx >= 0) EX.splice(idx, 1);
  favorites.delete(id);
  saveCustomEx();
  saveFavorites();
  renderBrowseAll();
  renderFavGrid();
}

  {text:"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle contraction and nerve function. Most adults are deficient. Leafy greens, nuts, and seeds are the best sources.", attr:"Nutritional biochemistry research", color:"#3a2a2a", text_c:"#fff"},
  {text:"Omega-3 fatty acids reduce muscle soreness and inflammation after exercise, support brain health, and lower cardiovascular disease risk. Fatty fish, walnuts, and flaxseed are top sources.", attr:"Nutritional and exercise science research", color:"#1a2a2a", text_c:"#fff"},
  {text:"Eating protein within a few hours of resistance training doesn't need to be immediate — but total daily protein is what matters most for muscle repair and growth.", attr:"International Journal of Sport Nutrition", color:"#2a1e3a", text_c:"#fff"},

  // EXERCISE SCIENCE
  {text:"Progressive overload is the single most important principle in strength training. Every week, aim to lift a little more, do one more rep, or add one more set. Your body adapts to the demand you place on it.", attr:"Exercise science fundamentals", color:"#1e3a2a", text_c:"#fff"},
  {text:"Compound movements — squats, deadlifts, rows, presses — recruit multiple muscle groups simultaneously, trigger greater hormone response, and build functional strength that transfers to real life.", attr:"Strength training research", color:"#2a1e2a", text_c:"#fff"},
  {text:"The mind-muscle connection is real. Consciously focusing on the muscle you're working increases activation by up to 22% compared to just moving the weight.", attr:"Journal of Strength and Conditioning Research", color:"#1a3a1a", text_c:"#fff"},
  {text:"Muscle soreness (DOMS) peaks 24–72 hours after exercise and is caused by microscopic damage to muscle fibers — which then repair stronger. Soreness is not required for progress, but adaptation is happening either way.", attr:"Exercise physiology research", color:"#3a2a1a", text_c:"#fff"},
  {text:"Rest periods between sets matter. Longer rests (2–3 minutes) lead to greater strength gains. Shorter rests (60 seconds) increase metabolic stress. Match your rest to your goal.", attr:"Strength and conditioning research", color:"#1a2a3a", text_c:"#fff"},
  {text:"Eccentric training — the lowering phase of a lift — produces greater muscle damage and adaptation than the concentric (lifting) phase. Slow down the lowering phase deliberately.", attr:"Journal of Applied Physiology", color:"#2a3a1e", text_c:"#fff"},
  {text:"High-intensity interval training (HIIT) produces comparable cardiovascular adaptations to moderate-intensity steady-state cardio in significantly less time. Both have their place.", attr:"American Journal of Physiology", color:"#1e2a2a", text_c:"#fff"},
  {text:"Flexibility and mobility are different things. Flexibility is passive range of motion. Mobility is active control through that range. Mobility is more relevant to functional movement and injury prevention.", attr:"Physical therapy and movement science", color:"#1a1e2a", text_c:"#fff"},
  {text:"Warming up with dynamic movements — leg swings, arm circles, hip circles — is more effective than static stretching before exercise. Static stretching before a workout can temporarily reduce power output.", attr:"Sports science research", color:"#2a2a1e", text_c:"#fff"},
  {text:"Zone 2 cardio — sustained moderate intensity where you can hold a conversation — is the foundation of aerobic fitness and metabolic health. It improves mitochondrial density and fat-burning efficiency.", attr:"Exercise physiology, Peter Attia MD", color:"#1a3a2a", text_c:"#fff"},

  // RECOVERY
  {text:"Recovery is not the absence of training — it is a deliberate part of the training process. Adaptation happens during rest, not during the workout itself.", attr:"Exercise physiology fundamentals", color:"#1e3a2a", text_c:"#fff"},
  {text:"Cold water immersion reduces muscle inflammation and perceived soreness after intense training. Even a cold shower can reduce next-day soreness measurably.", attr:"Sports recovery research", color:"#1a2a3a", text_c:"#fff"},
  {text:"Active recovery — light movement the day after hard training — increases blood flow, speeds removal of metabolic waste, and reduces soreness more effectively than complete rest.", attr:"Recovery science research", color:"#2a1a3a", text_c:"#fff"},
  {text:"Heart rate variability (HRV) is one of the best measures of recovery readiness. High HRV means your nervous system is recovered and ready to train. Low HRV is a signal to go easier.", attr:"Sports science and wearable research", color:"#3a1e2a", text_c:"#fff"},
  {text:"Foam rolling and self-myofascial release can improve range of motion and reduce soreness. It works primarily through neurological relaxation, not by 'breaking up fascia' as commonly believed.", attr:"Manual therapy research", color:"#1e2a1a", text_c:"#fff"},

  // MENTAL HEALTH & MINDSET
  {text:"Stress inoculation is real: moderate exercise stress trains the brain to respond more calmly to all other stressors. You become more emotionally resilient with every workout.", attr:"Stress physiology research", color:"#2a1a2a", text_c:"#fff"},
  {text:"The brain cannot distinguish between a vivid mental rehearsal and actual physical practice. Mental imagery activates the same neural pathways as physical movement. Visualization works.", attr:"Sports psychology research", color:"#1a2a1a", text_c:"#fff"},
  {text:"Self-compassion — treating yourself with the same kindness you'd give a friend — is more effective for long-term behavior change than self-criticism. Shame doesn't build habits. Kindness does.", attr:"Kristin Neff, PhD — Self-Compassion research", color:"#1e1e3a", text_c:"#fff"},
  {text:"The way you talk to yourself during difficult exercise matters. Research shows that motivational self-talk ('I can do this') measurably improves endurance performance.", attr:"Sports psychology research", color:"#3a2a2a", text_c:"#fff"},
  {text:"Exercise reduces the brain's reactivity to stress. Fit individuals show smaller cortisol spikes in response to psychological stressors and recover faster from them.", attr:"Psychoneuroendocrinology research", color:"#2a2a2a", text_c:"#fff"},
  {text:"Social connection and movement are both independently predictive of longevity. Combining them — exercise classes, walking with a friend, team sports — amplifies both benefits.", attr:"Longevity and social science research", color:"#1a3a3a", text_c:"#fff"},

  // POSTURE & MOVEMENT QUALITY
  {text:"Sitting for more than 8 hours a day increases all-cause mortality risk by 60% — even in people who exercise. Breaking up sitting with movement every 30–60 minutes counteracts much of this risk.", attr:"Annals of Internal Medicine", color:"#2a1e1a", text_c:"#fff"},
  {text:"The posterior chain — glutes, hamstrings, erector spinae — is chronically underactive in most people who sit for work. Weak posterior chains are the leading contributor to lower back pain.", attr:"Physical therapy and orthopedic research", color:"#1a2a3a", text_c:"#fff"},
  {text:"Breathing mechanics affect everything. Most people breathe into their chest. Diaphragmatic breathing — breathing into a 360-degree brace around the core — stabilizes the spine and improves movement quality.", attr:"Movement science and physical therapy", color:"#2a3a1a", text_c:"#fff"},
  {text:"Foot strength matters more than most people realize. Weak foot intrinsics contribute to knee, hip, and lower back problems. Single-leg balance and calf raises are among the most important exercises you can do.", attr:"Biomechanics and orthopedic research", color:"#1e2a2a", text_c:"#fff"},

  // HORMONES & METABOLISM
  {text:"Resistance training increases insulin sensitivity for up to 24–48 hours after a session. This means your cells are better at absorbing glucose — critical for metabolic health and energy levels.", attr:"Endocrinology research", color:"#1a3a1e", text_c:"#fff"},
  {text:"Cortisol — the stress hormone — is elevated by sleep deprivation, overtraining, and chronic psychological stress. High cortisol breaks down muscle tissue and promotes fat storage.", attr:"Endocrinology and stress research", color:"#3a1a2a", text_c:"#fff"},

  {text:"Testosterone — critical for muscle growth, energy, and mood in both men and women — is supported by resistance training, adequate sleep, and healthy body composition.", attr:"Endocrinology research", color:"#2a2a3a", text_c:"#fff"},

  // LONGEVITY
  {text:"The four pillars of longevity backed by the strongest evidence: exercise, sleep, nutrition, and social connection. No supplement or biohack comes close to these four.", attr:"Peter Attia, MD — Outlive", color:"#1a2a3a", text_c:"#fff"},
  {text:"VO2 max is the single strongest predictor of longevity — stronger than smoking status, blood pressure, or blood sugar. Building and maintaining aerobic fitness is one of the best investments you can make.", attr:"JAMA Network Open, longevity research", color:"#2a1a3a", text_c:"#fff"},
  {text:"Centenarians — people who live to 100 — share common traits: they move regularly (not necessarily intensely), eat mostly whole foods, sleep well, maintain social bonds, and have a sense of purpose.", attr:"Blue Zones research, Dan Buettner", color:"#1a3a2a", text_c:"#fff"},
  {text:"Healthspan matters as much as lifespan. The goal isn't just to live longer — it's to maintain physical and cognitive function as long as possible. Exercise is the most powerful tool for both.", attr:"Longevity medicine research", color:"#3a2a1a", text_c:"#fff"},
  {text:"The biological age of your cells can be different from your chronological age. Regular exercise, good sleep, and a low-inflammatory diet have all been shown to slow epigenetic aging.", attr:"Epigenetics and aging research", color:"#1e1a3a", text_c:"#fff"},

  // SPECIFIC TRAINING TIPS
  {text:"If you only had time for one exercise, the deadlift would be a strong candidate. It trains the entire posterior chain, core, and grip simultaneously — more muscles engaged than almost any other movement.", attr:"Strength training research", color:"#1a2a2a", text_c:"#fff"},
  {text:"Pull-ups are one of the best indicators of functional upper body strength and are strongly correlated with longevity. If you can't do one, assisted variations are an excellent goal to work toward.", attr:"Functional fitness research", color:"#2a3a1a", text_c:"#fff"},
  {text:"Planks train the core the way it's actually used in life — as a stabilizer, not a prime mover. A strong plank transfers to better performance in every lift and reduced back pain.", attr:"Core stability research", color:"#1e3a1a", text_c:"#fff"},
  {text:"Balance exercises — single-leg stands, single-leg deadlifts — activate stabilizer muscles that bilateral exercises miss. They also challenge the nervous system in ways that maintain coordination as you age.", attr:"Neuromuscular research", color:"#2a1a1e", text_c:"#fff"},
  {text:"Yoga and flexibility training improve proprioception — your body's sense of its own position in space. This reduces injury risk during other training and improves movement quality across the board.", attr:"Movement science research", color:"#1a2a1a", text_c:"#fff"},
  {text:"The Romanian deadlift is one of the most effective exercises for the posterior chain and is accessible with dumbbells at home. Learning the hip hinge pattern is fundamental to healthy movement.", attr:"Strength training fundamentals", color:"#3a1a1e", text_c:"#fff"},
  {text:"Resistance bands provide variable resistance — harder at peak contraction — which can complement free weights and is especially effective for shoulder and hip stabilizer work.", attr:"Resistance training research", color:"#1a2a3a", text_c:"#fff"},
  {text:"The glute medius — on the outer hip — is one of the most underdeveloped muscles in sedentary adults. Weakness here causes knee valgus, IT band issues, and lower back pain. Clamshells and lateral band walks target it directly.", attr:"Physical therapy research", color:"#2a1e3a", text_c:"#fff"},
  {text:"Breathing out on exertion — exhaling during the hard part of a lift — creates intra-abdominal pressure that protects the spine. It's a simple technique that dramatically improves safety under load.", attr:"Lifting mechanics and physical therapy", color:"#1e3a2a", text_c:"#fff"},
  {text:"Laughter, gratitude, and positive social interaction all trigger dopamine and serotonin release — the same pathways activated by exercise. Emotional wellbeing and physical health are not separate systems.", attr:"Psychoneuroimmunology research", color:"#2a2a2a", text_c:"#fff"},
  {text:"Time in nature — even 20 minutes in a park or garden — measurably lowers cortisol and blood pressure. Combining outdoor time with exercise amplifies the mental health benefits of both.", attr:"Environmental psychology research", color:"#1a3a1e", text_c:"#fff"},
  {text:"The lymphatic system — which removes waste from tissues — has no pump of its own. Movement is the pump. Exercise, deep breathing, and even light walking are essential for lymphatic circulation.", attr:"Physiology research", color:"#1e2a1e", text_c:"#fff"},
  {text:"Caffeine improves exercise performance by blocking adenosine receptors that signal fatigue. 3–6mg per kg of body weight, taken 30–60 minutes before exercise, is the evidence-based dose.", attr:"Sports nutrition research", color:"#2a1a2a", text_c:"#fff"},
  {text:"Microplastics have been found in human blood, lungs, and placental tissue. Reducing plastic food and drink containers where possible is a simple harm-reduction step with emerging evidence.", attr:"Environmental health research", color:"#1a1e3a", text_c:"#fff"},
  {text:"The immune system is strengthened by moderate regular exercise — but suppressed temporarily by extreme exertion. Consistent moderate training is more beneficial for immune function than occasional intense efforts.", attr:"Exercise immunology research", color:"#3a2a1e", text_c:"#fff"},

  {text:"The best exercise program is the one you will actually do consistently. Adherence beats perfection every time. A good routine you stick to is worth more than an optimal routine you abandon.", attr:"Behavioral exercise science", color:"#1a2a3a", text_c:"#fff"},

function getExWeightHistory(exId) {
  // Returns {last, pr} from session history for a given exercise
  // Only looks at working sets (not warmup)
  let last = null, pr = null;
  // Sessions are sorted newest first, so iterate in order
  for (const ses of sessions) {
    const entry = ses.entries.find(e => e.exId === exId);
    if (!entry) continue;
    const working = entry.sets.filter(s => s.type !== 'warmup' && s.weight > 0);
    if (!working.length) continue;
    const maxThisSes = Math.max(...working.map(s => s.eachHand ? s.weight : s.weight));
    if (last === null) last = maxThisSes; // first (newest) session found
    if (pr === null || maxThisSes > pr) pr = maxThisSes;
  }
  return {last, pr};
}

function selectEx(id) {

  const weightInput = document.getElementById('inp-weight');
  if (last !== null) {
    weightInput.value = last;
  } else {
    weightInput.value = '';
  }
  // Show last/PR hint above the hand toggle
  const existingHint = document.getElementById('weight-memory-hint');

    const hint = document.createElement('div');

    hint.innerHTML = (last !== null ? `<span>Last: <strong>${last} lbs</strong></span>` : '') +
      (pr !== null && pr !== last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong></span>` : '') +
      (pr !== null && pr === last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong> (your best!)</span>` : '');

}

function setHandMode(mode) {
  handMode = mode;

  const w = parseFloat(document.getElementById('inp-weight').value) || 0;

function addSet() {
  const sets = parseInt(document.getElementById('inp-sets').value) || 1;
  const reps = parseInt(document.getElementById('inp-reps').value) || 10;
  const weight = parseFloat(document.getElementById('inp-weight').value) || 0;
  const t = sType, idx = pending.length;
  const isBilateral = BILATERAL.has(selId) && weight > 0;
  const eachHand = isBilateral && handMode === 'each';
  const totalWeight = eachHand ? weight * 2 : weight;
  pending.push({sets, reps, weight, type: t, eachHand, totalWeight});
  let wl;
  if (weight === 0) wl = 'bodyweight';
  else if (eachHand) wl = `${weight} lbs each hand (${totalWeight} lbs total)`;
  else wl = `${weight} lbs total`;
  const chip = document.createElement('div');
  chip.className = `sc ${t}`; chip.id = `chip-${idx}`;
  chip.innerHTML = `<span>${t==='warmup'?'<span style="font-size:10px;margin-right:4px;opacity:.7">WARM-UP</span>':''}${sets}&times;${reps} @ ${wl}</span><button class="del-btn" onclick="rmSet(${idx})">&#x2715;</button>`;
  document.getElementById('set-list').appendChild(chip);
  // Show rest timer after adding a set
}

function rmSet(idx) {
  pending[idx] = null;
  const c = document.getElementById(`chip-${idx}`); if(c) c.remove();
}

function saveSession() {
  if (!selId) return;
  const valid = pending.filter(Boolean);
  if (!valid.length) { document.getElementById('save-status').textContent = 'Add at least one set first.'; return; }
  const date = document.getElementById('ses-date').value;
  const loc = document.getElementById('ses-loc').value;
  const ex = EX.find(e => e.id === selId);
  let ses = sessions.find(s => s.date === date);
  if (!ses) { ses = {id: Date.now(), date, entries: []}; sessions.push(ses); }
  const existing = ses.entries.find(en => en.exId === selId && en.location === loc);
  if (existing) { existing.sets.push(...valid); }
  else { ses.entries.push({exId: selId, exName: ex.name, cat: ex.cat, location: loc, sets: valid}); }
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save();
  document.getElementById('save-status').textContent = 'Saved!';
  pending = []; document.getElementById('set-list').innerHTML = '';
  renderTodayCard();
  // Collapse log form and exercise panel after saving
  document.getElementById('log-form').style.display = 'none';
  selId = null;
  if (exPanelOpen) toggleExercisesPanel();
  renderFavGrid();
  setTimeout(() => document.getElementById('save-status').textContent = '', 2500);
}

function getSuggestions() {
  const loc = document.getElementById('ses-loc')?.value || 'all';
  const recentCats = getRecentlyTrainedCats();

  // Get today's already-logged exercise IDs (skip these specific exercises)
  const today = localDate();
  const todaySes = sessions.find(s => s.date === today);
  const todayExIds = new Set(todaySes ? todaySes.entries.map(e => e.exId) : []);

  // Build pool filtered by location
  const locPool = EX.filter(e => loc === 'all' || e.loc.includes(loc));

  // Only skip specific exercises already done today + previous days' recovery categories
  const fresh = locPool.filter(e =>
    !todayExIds.has(e.id) &&
    !recentCats.has(e.cat) &&
    !['balance','mobility','yoga'].includes(e.cat)
  );
  const pool = fresh.length >= 3 ? fresh : locPool.filter(e =>
    !todayExIds.has(e.id) &&
    !['balance','mobility','yoga'].includes(e.cat)
  );

  // Pick 5 diverse exercises across different categories
  const picked = [];
  const usedCats = new Set();
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (const ex of shuffled) {
    if (!usedCats.has(ex.cat)) { picked.push(ex); usedCats.add(ex.cat); }
    if (picked.length >= 5) break;
  }
  if (picked.length < 5) {
    for (const ex of shuffled) {
      if (!picked.find(p => p.id === ex.id)) picked.push(ex);
      if (picked.length >= 5) break;
    }
  }

  const el = document.getElementById('suggestions-list');
  if (!picked.length) { el.innerHTML = '<div style="color:var(--text3);font-size:14px;padding:8px 0">No exercises available — try changing location.</div>'; return; }

  // Build context message
  const msgs = [];
  if (todayExIds.size > 0) msgs.push(`skipping ${todayExIds.size} already done today`);
  if (recentCats.size > 0) msgs.push(`avoiding from previous days: ${[...recentCats].map(c => CAT[c]||c).join(', ')}`);
  const contextMsg = msgs.length
    ? `<div style="font-size:12px;color:var(--text3);margin-bottom:10px">${msgs.join(' · ')}</div>`
    : '';

  const locLabel = {all:'All locations', gym:'Gym', home:'Home', travel:'Traveling'}[loc] || loc;
  el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer" onclick="toggleSuggestions()">'
    + '<div style="font-size:13px;font-weight:600;color:var(--text2)">Suggested for ' + locLabel + ' (' + picked.length + ')</div>'
    + '<span id="sug-list-chev" style="font-size:12px;color:var(--text3)">&#9650;</span>'
    + '</div>'
    + '<div id="sug-list-body">'
    + contextMsg + picked.map(ex => {
    return `<div id="sug-row-${ex.id}" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectSuggestion('${ex.id}')">

        <div style="font-size:13px;color:#333">${CAT[ex.cat]||ex.cat}</div>
      </div>
      <span style="font-size:22px;color:var(--accent)">+</span>
    </div>`;
  }).join('') + '</div>';
}

const HSUB = {bench:'incline_ball',row_barbell:'row_db',ohp:'db_shoulder_press',skull_crusher:'band_tricep',pullup:'band_row',squat:'goblet_squat',deadlift:'band_rdl',leg_press:'goblet_squat',hip_thrust:'glute_bridge',cable_crunch:'crunch',foam_roller_back:'cat_cow',foam_roller_legs:'hip_circle',single_leg_rdl_bal:'single_leg_stand'};
const TSUB = {...HSUB, db_lateral:'band_lateral',db_shoulder_press:'band_ohp',bicep_curl:'band_curl',tricep_dip:'band_tricep',row_db:'band_row',rdl:'band_rdl',goblet_squat:'band_squat',db_lunge:'band_squat',incline_ball:'pushup',glute_bridge:'glute_bridge'};

function resolveId(id, loc) {
  const ex = EX.find(e => e.id === id);
  if (ex && ex.loc.includes(loc)) return id;
  const subs = loc === 'home' ? HSUB : TSUB;
  const sub = subs[id];
  if (sub && EX.find(e => e.id === sub && e.loc.includes(loc))) return sub;
  const fb = EX.find(e => ex && e.cat === ex.cat && e.loc.includes(loc));
  return fb ? fb.id : id;
}

function pickN(pool, n, loc) {
  const out = [], seen = new Set();
  for (const id of pool) {
    const rid = resolveId(id, loc);
    if (!seen.has(rid) && EX.find(e => e.id === rid)) { seen.add(rid); out.push(rid); }
    if (out.length >= n) break;
  }
  return out;
}

function getSR(goal, energy, sec) {
  if (sec === 'balance') return {sets:2, reps:'30 sec each side'};
  if (sec === 'warmup' || sec === 'stretch') return {sets:1, reps:'8–10 reps'};
  if (goal === 'strength') return {sets: energy==='low'?2:3, reps: energy==='high'?'6–8': energy==='low'?'10':'8–10'};
  return {sets: energy==='low'?2:3, reps: energy==='high'?'12–15': energy==='low'?'10–12':'12–15'};
}

    return 'wt-daily-checked-' + localDate();

  return 'wt-daily-' + suffix; // list and other data persist permanently
}

function loadDailyList() {
  const saved = localStorage.getItem(getDailyKey('list'));
  const list = saved ? JSON.parse(saved) : DAILY_DEFAULT.map(e => ({...e}));
  // Ensure plank is always first
  const plankIdx = list.findIndex(e => e.id === 'plank');
  if (plankIdx > 0) {
    const plank = list.splice(plankIdx, 1)[0];
    list.unshift(plank);
    saveDailyList(list);
  }
  return list;
}

function saveDailyList(list) {
  localStorage.setItem(getDailyKey('list'), JSON.stringify(list));
}

function loadDailyChecked() {
  const saved = localStorage.getItem(getDailyKey('checked'));
  return saved ? new Set(JSON.parse(saved)) : new Set();
}

function saveDailyChecked(checked) {
  localStorage.setItem(getDailyKey('checked'), JSON.stringify([...checked]));
}

let dailySwapIdx = null;

// ── PLANK-O-METER ──────────────────────────────────────────
let plankTimerInterval = null;
let plankTimerSeconds = 0;
let plankTimerRunning = false;

function getPlankRecords() {
  try { return JSON.parse(localStorage.getItem('wt-plank-records') || '[]'); } catch(e) { return []; }
}
function savePlankRecord(secs) {
  const records = getPlankRecords();
  records.push({id: Date.now(), date: localDate(), secs});
  localStorage.setItem('wt-plank-records', JSON.stringify(records));
}
function deletePlankRecord(id) {
  const records = getPlankRecords().filter(r => r.id !== id);
  localStorage.setItem('wt-plank-records', JSON.stringify(records));
  renderDashboard();
}
function editPlankRecord(id) {
  const records = getPlankRecords();
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  const el = document.getElementById('plank-rec-' + id);
  if (!el) return;
  el.innerHTML = '<div style="display:flex;gap:8px;align-items:center;flex:1">'
    + '<input type="text" id="plank-edit-' + id + '" value="' + formatPlankTime(rec.secs) + '" style="font-size:14px;padding:6px 10px;width:80px">'
    + '<button onclick="savePlankEdit(' + id + ')" class="btn btn-sm btn-g">✓</button>'
    + '<button onclick="renderDashboard()" class="btn btn-sm">✕</button>'
    + '</div>';
}
function savePlankEdit(id) {
  const val = document.getElementById('plank-edit-' + id)?.value.trim();
  if (!val) return;
  let secs = 0;
  if (val.includes(':')) { const [m,s] = val.split(':').map(Number); secs = m*60+s; }
  else secs = parseInt(val) || 0;
  if (!secs) return;
  const records = getPlankRecords();
  const rec = records.find(r => r.id === id);
  if (rec) rec.secs = secs;
  localStorage.setItem('wt-plank-records', JSON.stringify(records));
  renderDashboard();
}
function getPlankPR() {
  const records = getPlankRecords();
  return records.length ? Math.max(...records.map(r => r.secs)) : 0;
}
function getPlankLast() {
  const records = getPlankRecords();
  if (!records.length) return null;
  const today = localDate();
  const past = records.filter(r => r.date < today);
  return past.length ? past[past.length-1] : null;
}
function formatPlankTime(s) {
  return s >= 60 ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : s + 's';
}
function startPlankTimer() {
  if (plankTimerRunning) return;
  plankTimerRunning = true;
  plankTimerInterval = setInterval(() => {
    plankTimerSeconds++;
    const el = document.getElementById('plank-timer-display');
    if (el) el.textContent = formatPlankTime(plankTimerSeconds);
  }, 1000);
  document.getElementById('plank-start-btn').style.display = 'none';
  document.getElementById('plank-stop-btn').style.display = 'inline-block';
}
function stopPlankTimer() {
  clearInterval(plankTimerInterval);
  plankTimerRunning = false;
  const secs = plankTimerSeconds;
  plankTimerSeconds = 0;
  plankTimerInterval = null;

  // Show editable result instead of saving immediately
  const display = document.getElementById('plank-timer-display');
  const startBtn = document.getElementById('plank-start-btn');
  const stopBtn = document.getElementById('plank-stop-btn');
  if (display) display.textContent = formatPlankTime(secs);
  if (startBtn) startBtn.style.display = 'none';
  if (stopBtn) stopBtn.style.display = 'none';

  // Show confirm row with editable time
  const confirmRow = document.getElementById('plank-confirm-row');
  const confirmInput = document.getElementById('plank-confirm-input');
  if (confirmRow) confirmRow.style.display = 'flex';
  if (confirmInput) confirmInput.value = formatPlankTime(secs);
}

function confirmPlankSave() {
  const val = document.getElementById('plank-confirm-input')?.value.trim();
  if (!val) return;
  let secs = 0;
  if (val.includes(':')) { const [m,s] = val.split(':').map(Number); secs = m*60+s; }
  else secs = parseInt(val) || 0;
  if (secs > 0) {
    savePlankRecord(secs);
    toggleDailyCheck('plank');
  }
  renderDaily();
}
function savePlankManual() {
  const inp = document.getElementById('plank-manual-input');
  if (!inp) return;
  const val = inp.value.trim();
  let secs = 0;
  if (val.includes(':')) {
    const [m, s] = val.split(':').map(Number);
    secs = m*60 + s;
  } else {
    secs = parseInt(val) || 0;
  }
  if (secs > 0) {
    savePlankRecord(secs);
    toggleDailyCheck('plank');
  }
}

function launchFireworks() {
  // Only show if user is on the Daily tab
  const dailyPage = document.getElementById('page-daily');
  if (!dailyPage || !dailyPage.classList.contains('on')) return;

  // Remove any existing overlay
  const existing = document.getElementById('fw-fullscreen');
  if (existing) existing.remove();

  // Attach overlay to daily page only, not body
  const overlay = document.createElement('div');
  overlay.id = 'fw-fullscreen';
  overlay.style.cssText = 'position:absolute;inset:0;z-index:9999;pointer-events:none;background:rgba(83,74,183,0.18);transition:opacity 1s';
  dailyPage.style.position = 'relative';
  dailyPage.appendChild(overlay);

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  overlay.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;

  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43','#fff','#ff6eb4','#00e5ff','#ffb347'];

  const rockets = [];
  const explosions = [];

  function launchRocket() {
    const x = W * (0.15 + Math.random() * 0.7);
    rockets.push({
      x, y: H,
      vy: -(8 + Math.random() * 6),
      targetY: H * (0.1 + Math.random() * 0.5),
      color: colors[Math.floor(Math.random() * colors.length)],
      trail: []
    });
  }

  function explode(x, y, color) {
    const count = 60 + Math.floor(Math.random() * 30);
    const streaks = [];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i;
      const speed = 2.5 + Math.random() * 4;
      streaks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        length: 6 + Math.random() * 8,
        color,
        gravity: 0.06 + Math.random() * 0.04
      });
    }
    // Add a few glitter sparks
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2;
      streaks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        alpha: 1,
        length: 2,
        color: '#fff',
        gravity: 0.1
      });
    }
    explosions.push({streaks, age: 0});
  }

  let frame = 0;
  // Launch schedule
  const launchTimes = [0, 25, 45, 70, 90, 115, 140, 160, 185, 210, 235, 255, 280, 310];

  function animate() {
    ctx.clearRect(0, 0, W, H);

    // Launch rockets on schedule
    if (launchTimes.includes(frame)) launchRocket();

    // Update and draw rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.trail.push({x: r.x, y: r.y});
      if (r.trail.length > 12) r.trail.shift();

      // Draw trail
      for (let t = 0; t < r.trail.length; t++) {
        const alpha = (t / r.trail.length) * 0.7;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.trail[t].x, r.trail[t].y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw rocket head
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fill();

      r.y += r.vy;

      // Explode when reaching target
      if (r.y <= r.targetY) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    // Update and draw explosions
    for (let e = explosions.length - 1; e >= 0; e--) {
      const exp = explosions[e];
      exp.age++;
      let allDead = true;

      for (let s = exp.streaks.length - 1; s >= 0; s--) {
        const streak = exp.streaks[s];
        streak.alpha -= 0.018;
        if (streak.alpha <= 0) { exp.streaks.splice(s, 1); continue; }
        allDead = false;

        const nx = streak.x + streak.vx;
        const ny = streak.y + streak.vy;

        ctx.globalAlpha = streak.alpha;
        ctx.strokeStyle = streak.color;
        ctx.lineWidth = streak.length > 4 ? 2 : 1;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(streak.x, streak.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        streak.x = nx;
        streak.y = ny;
        streak.vy += streak.gravity;
        streak.vx *= 0.97;
      }

      if (allDead) explosions.splice(e, 1);
    }

    ctx.globalAlpha = 1;
    frame++;

    if (frame < 360) {
      requestAnimationFrame(animate);
    } else {
      // Fade out overlay
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 1000);
    }
  }

  animate();
}

// ── SMART EXERCISE SEARCH ──────────────────────────────────
let libraryOpen = false;

function smartExSearch() {
  const query = (document.getElementById('ex-search')?.value || '').trim();
  const el = document.getElementById('smart-search-results');

  if (!query) { el.innerHTML = ''; return; }

  const q = query.toLowerCase();
  const scored = EX.map(e => {
    const name = e.name.toLowerCase();
    const cat = (CAT[e.cat]||e.cat).toLowerCase();
    const targets = (e.targets||'').toLowerCase();
    const id = e.id.toLowerCase();
    let score = 0;
    if (name.startsWith(q)) score += 10;
    else if (name.includes(q)) score += 6;
    if (id.includes(q)) score += 4;
    if (cat.includes(q)) score += 3;
    if (targets.includes(q)) score += 2;
    return {ex: e, score};
  }).filter(s => s.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);

  if (scored.length) {
    el.innerHTML =
      scored.map(({ex}) => `<div onclick="selectExAndOpenForm('${ex.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px;cursor:pointer">
        <div>

// Large groups need 48hrs, small groups 24hrs, mobility/balance anytime
const RECOVERY_HOURS = {
  legs: 48, back: 48, glutes: 48, chest: 48,
  shoulders: 24, arms: 24, core: 24,
  balance: 0, mobility: 0, yoga: 0,
};

function getRecentlyTrainedCats() {
  const now = new Date();
  const recentCats = new Set();
  sessions.forEach(s => {
    const sesDate = new Date(s.date + 'T12:00:00');
    const hoursAgo = (now - sesDate) / (1000 * 60 * 60);
    s.entries.forEach(e => {
      const recovery = RECOVERY_HOURS[e.cat] ?? 24;
      if (recovery > 0 && hoursAgo <= recovery) {
        recentCats.add(e.cat);
      }
    });
  });
  return recentCats;
}

function buildPlan() {
  const {loc, focus, goal, energy} = qaAns;

  // Get recently trained categories to avoid
  const recentCats = getRecentlyTrainedCats();

  // Filter main pool to exclude recently trained muscle groups
  // But only if there are enough alternatives — don't leave user with nothing
  const rawMainPool = POOL[goal][focus] || POOL.strength.upper;
  const freshPool = rawMainPool.filter(id => {
    const ex = EX.find(e => e.id === id) || EX.find(e => e.id === resolveId(id, loc));
    return ex && !recentCats.has(ex.cat);
  });
  // Use fresh pool if it has at least 2 exercises, otherwise fall back to full pool
  const mainPool = freshPool.length >= 2 ? freshPool : rawMainPool;

  const wuPool = POOL.warmup[focus] || POOL.warmup.upper;
  const stPool = POOL.stretch[focus] || POOL.stretch.upper;
  const balPool = POOL.balance[focus] || POOL.balance.upper;
  const fwu = wuPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  const fst = stPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  const fbal = balPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  plan = [
    ...pickN(fwu, 3, loc).map(id => ({exId:id, sec:'warmup', ...getSR(goal,energy,'warmup'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(mainPool, 3, loc).map(id => ({exId:id, sec:'main', ...getSR(goal,energy,'main'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(fbal, 2, loc).map(id => ({exId:id, sec:'balance', ...getSR(goal,energy,'balance'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(fst, 3, loc).map(id => ({exId:id, sec:'stretch', ...getSR(goal,energy,'stretch'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
  ];
  // Store recovery info for display
  plan._recentCats = [...recentCats];
  drawPlan();
}
