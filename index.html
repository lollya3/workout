<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:#f7f5f0; --surface:#fff; --surface2:#f0ede6;
  --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.15);
  --text:#111; --text2:#333; --text3:#555;
  --accent:#534AB7; --alight:#EEEDFE;
  --gold:#D85A30; --gold-light:#FAECE7;
  --danger:#c0392b; --warn:#b8860b; --warn-light:#fdf8e4;
  --gym-c:#1a3a5c; --gym-bg:#e8f0f8;
  --home-c:#534AB7; --home-bg:#EEEDFE;
  --travel-c:#7a4f1a; --travel-bg:#faf0e4;
  --bal-c:#1a5c5a; --bal-bg:#e8f8f7;
  --mob-c:#5a2d7a; --mob-bg:#f0e8f8;
  --r:10px; --rl:16px;
  --sh:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:20px}
h1,h2,h3{font-family:'DM Serif Display',serif}
nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nav-inner{max-width:700px;margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:flex-start;gap:0}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent);padding:15px 0;margin-right:auto;white-space:nowrap}
.nt{padding:10px 14px;font-size:12px;font-weight:600;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1}
.nt.on{color:var(--accent);border-bottom-color:var(--accent)}
@media(max-width:380px){.nt{padding:9px 10px;font-size:11px}.logo{font-size:17px}}
.page{display:none;max-width:700px;margin:0 auto;padding:16px 14px 80px}
.page.on{display:block}
.card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;margin-bottom:13px;box-shadow:var(--sh)}
.ctitle{font-family:'DM Serif Display',serif;font-size:21px;margin-bottom:13px;color:var(--text)}
.lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px;display:block}
input,select{font-family:'DM Sans',sans-serif;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
.btn{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;padding:11px 18px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-g{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-g:hover{background:#234a31}
.btn-sm{font-size:13px;padding:7px 14px;border-radius:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.gym{background:var(--gym-bg);color:var(--gym-c);border-color:var(--gym-c)}
.chip.home{background:var(--home-bg);color:var(--home-c);border-color:var(--home-c)}
.chip.travel{background:var(--travel-bg);color:var(--travel-c);border-color:var(--travel-c)}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-bottom:13px}
.ec{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ec.sel{border:2px solid var(--accent)}
.ec.exp{grid-column:1/-1}
.ec-hd{padding:12px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:5px}
.ec-hd:hover .ec-nm{color:var(--accent)}
.ec-nm{font-size:16px;font-weight:600;color:var(--text);line-height:1.3}
.ec-sub{font-size:13px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.chev{font-size:13px;color:var(--text3);flex-shrink:0;margin-top:2px;transition:transform .2s}
.ec.exp .chev{transform:rotate(180deg)}
.ec-dt{display:none;border-top:1px solid var(--border);padding:14px}
.ec.exp .ec-dt{display:block}
.ec-inner{display:grid;grid-template-columns:105px 1fr;gap:13px;align-items:start}
@media(max-width:360px){.ec-inner{grid-template-columns:1fr}}
.di-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:3px}
.di-val{font-size:14px;color:var(--text);line-height:1.5}
.di-tip{font-size:14px;color:var(--warn);line-height:1.5}
.di-row{margin-bottom:8px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:9px}
.pill-gym{background:var(--gym-bg);color:var(--gym-c)}
.pill-home{background:var(--home-bg);color:var(--home-c)}
.pill-travel{background:var(--travel-bg);color:var(--travel-c)}
.pill-balance{background:var(--bal-bg);color:var(--bal-c)}
.pill-mobility{background:var(--mob-bg);color:var(--mob-c)}
.sec-tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:inline-block;padding:3px 10px;border-radius:9px;margin-bottom:10px}
.tag-wu{background:var(--warn-light);color:var(--warn)}
.tag-main{background:var(--alight);color:var(--accent)}
.tag-str{background:var(--gym-bg);color:var(--gym-c)}
.tag-bal{background:var(--bal-bg);color:var(--bal-c)}
.stype-row{display:flex;gap:7px;margin-bottom:10px}
.stype{font-size:14px;padding:7px 16px;border-radius:20px;border:1px solid var(--border2);background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;font-weight:500}
.stype.on{background:var(--surface2);color:var(--text);font-weight:600}
.sf-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:9px}
@media(max-width:360px){.sf-row{grid-template-columns:1fr 1fr}.sf-row .btn{grid-column:1/-1}}
.set-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sc{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-radius:8px;font-size:14px}
.sc.working{background:var(--surface2);color:var(--text)}
.sc.warmup{background:var(--warn-light);color:var(--warn)}
.del-btn{border:none;background:none;cursor:pointer;font-size:17px;color:inherit;opacity:.4;padding:0 2px;line-height:1}
.del-btn:hover{opacity:1}
.hc{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:11px;box-shadow:var(--sh)}
.hc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.he{padding:7px 0;border-bottom:1px solid var(--border);font-size:15px}
.he:last-child{border-bottom:none}
.he-nm{font-weight:600;margin-bottom:2px}
.he-sets{font-size:13px;color:var(--text2)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.sc2{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;text-align:center;box-shadow:var(--sh)}
.sn{font-family:'DM Serif Display',serif;font-size:30px;color:var(--accent);line-height:1;margin-bottom:4px}
.sl{font-size:13px;color:var(--text2);font-weight:500}
.pr-list{display:flex;flex-direction:column}
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
.pr-row:last-child{border-bottom:none}
.pr-val{font-weight:600;color:var(--gold)}
.cw{position:relative;width:100%;height:220px;margin-bottom:5px}
.tog-g{display:flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.tog{padding:9px 15px;font-size:15px;border:none;background:none;cursor:pointer;color:var(--text2);font-family:'DM Sans',sans-serif;font-weight:500}
.tog.on{background:var(--accent);color:#fff}
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:16px}
.streak-banner{background:linear-gradient(135deg,var(--accent) 0%,#3C3489 100%);color:#fff;border-radius:var(--rl);padding:17px;margin-bottom:13px;display:flex;align-items:center;gap:14px}
.sb-text h2{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:2px}
.sb-text p{font-size:14px;opacity:.85}
.coach-hero{background:linear-gradient(135deg,#3C3489 0%,#26215C 100%);border-radius:var(--rl);padding:17px;margin-bottom:15px;color:#fff}
.coach-hero h2{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin-bottom:4px}
.coach-hero p{font-size:15px;opacity:.85;line-height:1.5}
.qa-card{background:var(--surface);border-radius:var(--rl);border:1px solid var(--border);padding:18px;margin-bottom:13px;box-shadow:var(--sh)}
.qa-q{font-size:18px;font-weight:600;margin-bottom:14px;color:var(--text)}
.qa-opts{display:flex;flex-direction:column;gap:9px}
.qa-opt{font-family:'DM Sans',sans-serif;font-size:16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.qa-opt:hover{border-color:var(--accent);background:var(--alight)}
.qa-prev{margin-bottom:12px}
.qa-pr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)}
.qa-pr:last-child{border-bottom:none}
.qa-pq{color:var(--text3)}
.qa-pa{color:var(--accent);font-weight:500}
.prog-bar{background:var(--surface2);border-radius:20px;height:5px;margin-bottom:14px;overflow:hidden}
.prog-fill{background:var(--accent);height:5px;border-radius:20px;transition:width .3s}
.plan-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:11px;box-shadow:var(--sh)}
.plan-row{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.plan-row:last-of-type{border-bottom:none}
.plan-info{flex:1}
.plan-nm{font-size:16px;font-weight:600;color:var(--text)}
.plan-sr{font-size:14px;color:var(--text2);margin-top:2px}
.plan-tip{font-size:13px;color:var(--warn);margin-top:3px;font-style:italic}
.swap-btn{font-size:13px;padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.swap-btn:hover{border-color:var(--accent);color:var(--accent)}
.action-menu{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:9px;margin:6px 0;display:flex;gap:8px;flex-wrap:wrap}
.action-item{font-size:14px;padding:7px 15px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;white-space:nowrap}
.action-item:hover{border-color:var(--accent);color:var(--accent)}
.action-delete{color:var(--danger);border-color:var(--danger)}
.action-delete:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.add-ex-btn{font-size:14px;padding:8px 15px;border-radius:20px;border:1px dashed var(--border2);background:none;color:var(--text3);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:10px;display:block;width:100%;text-align:center}
.add-ex-btn:hover{border-color:var(--accent);color:var(--accent)}
.swap-panel{background:var(--surface2);border-radius:var(--r);padding:12px;margin:6px 0;border:1px solid var(--border2)}
.swap-ttl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:8px}
.swap-opt{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.swap-opt:hover{border-color:var(--accent)}
.swap-nm{font-size:15px;font-weight:500}
.swap-meta{font-size:13px;color:var(--text3)}
.browse-link{font-size:14px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;padding:4px 0;text-decoration:underline}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto;padding:18px 14px}
.modal-bg.on{display:block}
.modal-inner{background:var(--surface);border-radius:var(--rl);max-width:500px;margin:0 auto;padding:20px}
.modal-close{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2);line-height:1}
.br-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.br-row:hover .br-nm{color:var(--accent)}
.br-row:last-child{border-bottom:none}
.star-btn{background:none;border:none;cursor:pointer;font-size:20px;padding:2px 4px;line-height:1;opacity:.35;transition:opacity .15s}
.star-btn.on{opacity:1}
.star-btn:hover{opacity:.75}
.motiv-card{border-radius:var(--rl);padding:28px 22px;margin-bottom:14px;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.motiv-quote{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.35;margin-bottom:14px;position:relative;z-index:1}
.motiv-attr{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75;position:relative;z-index:1}
.motiv-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:14px;position:relative;z-index:1}
.motiv-tip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:28px 24px;margin-bottom:14px;box-shadow:var(--sh)}
.motiv-tip-icon{font-size:40px;margin-bottom:14px}
.motiv-tip-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:12px;color:var(--text)}
.motiv-tip-body{font-size:19px;color:var(--text2);line-height:1.7}
.motiv-refresh{display:flex;justify-content:center;margin-top:6px}

</style>
</head>

};

const CATS = Object.keys(CAT);

function svg(body) {
  return '<svg width="100" height="54" viewBox="0 0 110 56">' + body + '</svg>';
}
const head = (cx,cy) => `<ellipse cx="${cx}" cy="${cy}" rx="9" ry="9" fill="#d4cfc8"/>`;

const wt = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#534AB7"/>`;

// CHEST
{id:'bench',name:'Bench press',cat:'chest',loc:['gym'],

function localDate(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function calcStreakFor(activeDateSet) {
  const today = localDate();
  const sorted = [...activeDateSet].sort().reverse();
  let streak = 0;
  let cur = new Date(today + 'T12:00:00');
  for (const d of sorted) {
    if (d === localDate(cur)) { streak++; cur.setDate(cur.getDate()-1); }
    else if (d < localDate(cur)) break;
  }
  return streak;
}

function getWorkoutDates() {
  return new Set(sessions.filter(s => s.entries.length > 0).map(s => s.date));
}

function getDailyDates() {
  const dates = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('wt-daily-checked-')) {
      const dateStr = key.replace('wt-daily-checked-', '');
      try {
        const checked = JSON.parse(localStorage.getItem(key) || '[]');
        const list = JSON.parse(localStorage.getItem('wt-daily-list') || '[]');
        if (checked.length >= (list.length || 12)) dates.add(dateStr);
      } catch(e) {}
    }
  }
  return dates;
}

function getGoalDates() {
  const dates = new Set();
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('wt-goal-done-')) {
      const dateStr = key.replace('wt-goal-done-', '');
      const goalKey = 'wt-goal-' + dateStr;
      const goalText = localStorage.getItem(goalKey);
      if (goalText && goalText.trim()) dates.add(dateStr);
    }
  }
  return dates;
}

function getTripleCrownDates() {
  const workout = getWorkoutDates();
  const daily = getDailyDates();
  const goal = getGoalDates();
  const all = new Set();
  workout.forEach(d => { if (daily.has(d) && goal.has(d)) all.add(d); });
  return all;
}

function calcStreak() {
  // Default streak = workout OR daily dozen (for backward compat)
  const combined = new Set([...getWorkoutDates(), ...getDailyDates()]);
  return calcStreakFor(combined);
}

function save() { localStorage.setItem('wt-sessions', JSON.stringify(sessions)); }

// ── MIGRATE: merge sessions by date, move location to entries ──
function migrateSessions() {
  let changed = false;
  // Merge any sessions with same date
  const byDate = {};
  sessions.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = {id: s.id, date: s.date, entries: []};
    // Move location onto each entry if not already there
    s.entries.forEach(e => {
      if (!e.location) { e.location = s.location || 'gym'; changed = true; }
      byDate[s.date].entries.push(e);
    });
    if (s.location) changed = true; // will remove it
  });
  const merged = Object.values(byDate);
  if (merged.length !== sessions.length || changed) {
    sessions = merged;
    sessions.sort((a,b) => b.date.localeCompare(a.date));
    save();
  }
}

function renderFavGrid() {
  const grid = document.getElementById('fav-grid');
  if (!grid) return;
  const query = (document.getElementById('ex-search')?.value || '').toLowerCase().trim();

  let allEx = EX;
  if (query) {
    // Search by name, category, or targets
    allEx = EX.filter(e =>
      e.name.toLowerCase().includes(query) ||
      (CAT[e.cat]||e.cat).toLowerCase().includes(query) ||
      (e.targets||'').toLowerCase().includes(query)
    );
  }

  const favEx = allEx.filter(e => favorites.has(e.id));
  const otherEx = allEx.filter(e => !favorites.has(e.id));

  let html = '';

  if (query) {
    // In search mode, just show flat results with a count
    if (!allEx.length) {
      html = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:14px">No exercises match "${query}"</div>`;
    } else {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">${allEx.length} result${allEx.length!==1?'s':''}</div>`;
      html += allEx.map(e => exCardHTML(e)).join('');
    }
  } else {
    // Normal mode: favorites first, then all others
    if (favEx.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:8px">⭐ Favorites</div>`;
      html += favEx.map(e => exCardHTML(e)).join('');
    }
    if (otherEx.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:${favEx.length?'16px':'0'};margin-bottom:8px">All exercises</div>`;
      html += otherEx.map(e => exCardHTML(e)).join('');
    }
    if (!favEx.length && !otherEx.length) {
      html = `<div style="text-align:center;padding:20px;color:var(--text3);font-size:14px">No exercises found.</div>`;
    }
  }

  grid.innerHTML = html;
}

  const isFav = favorites.has(e.id);
  const pills = e.loc.map(l => `<span class="pill pill-${l}">${LOC[l]}</span>`).join('');
  return `<div class="ec${isSel?' sel':''}${isExp?' exp':''}" id="ec-${e.id}" style="margin-bottom:8px">
    <div class="ec-hd" onclick="toggleCard('${e.id}')">
      <div style="flex:1">
        <div class="ec-nm">${e.name}${isSel?'<span style="font-size:10px;color:var(--accent);margin-left:5px">&#10003; logging</span>':''}</div>

let loggedListOpen = true;

  loggedListOpen = !loggedListOpen;

  if (inner) inner.style.display = loggedListOpen ? 'block' : 'none';
  if (chev) chev.innerHTML = loggedListOpen ? '&#9650;' : '&#9660;';

function renderTodayCard() {
  const el = document.getElementById('today-logged-list');
  if (!el) return;
  const today = localDate();
  const todaySessions = sessions.filter(s => s.date === today);

  const ses = todaySessions[0];
  if (!ses.entries.length) { el.innerHTML = ''; return; }

    ${ses.entries.map((e, eIdx) => {
      const wk = e.sets.filter(s2 => s2.type !== 'warmup');
      const wu = e.sets.filter(s2 => s2.type === 'warmup');
      const notes = getExNotes();
      const note = notes[e.exId] || '';
      return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">

          <button onclick="deleteTodayEntry(${ses.id},${eIdx})" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:2px 6px;line-height:1" title="Remove">&#x2715;</button>
        </div>
        ${[...wu.map((s2,si) => ({s2,si,type:'warmup'})), ...wk.map((s2,si) => ({s2,si:wu.length+si,type:'working'}))].map(({s2,si}) => {
          const rowId = `today-set-${ses.id}-${eIdx}-${si}`;
          const wl = s2.weight > 0 ? `${s2.weight}lbs` : 'BW';
          const tag = s2.type==='warmup' ? `<span style="font-size:10px;background:var(--warn-light);color:var(--warn);padding:1px 5px;border-radius:8px;margin-right:4px">WU</span>` : '';
          return `<div id="${rowId}" style="display:flex;align-items:center;gap:8px;padding:4px 0">
            <span style="flex:1;font-size:13px;color:var(--text2)">${tag}${s2.sets}×${s2.reps} @ ${wl}</span>
            <button onclick="editTodaySet('${ses.id}',${eIdx},${si},'${rowId}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--accent);padding:2px 6px;font-family:inherit">Edit</button>
          </div>`;
        }).join('')}
        <div style="margin-top:6px">
          <div id="note-edit-area-${eIdx}" style="display:none">
            <textarea id="note-edit-${eIdx}" style="font-family:'DM Sans',sans-serif;font-size:13px;width:100%;padding:8px;border:1px solid var(--border2);border-radius:8px;resize:none;height:60px;color:var(--text);background:var(--surface)">${note}</textarea>
            <button onclick="saveTodayNote('${e.exId}',${eIdx})" class="btn btn-sm btn-g" style="margin-top:4px">Save note</button>
          </div>
          <button onclick="toggleTodayNote(${eIdx})" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--accent);font-family:inherit;padding:2px 0">${note ? '✏️ Edit note' : '+ Add note'}</button>
        </div>
      </div>`;

function toggleTodayNote(eIdx) {
  const area = document.getElementById('note-edit-area-' + eIdx);
  if (!area) return;
  area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function saveTodayNote(exId, eIdx) {
  const val = document.getElementById('note-edit-' + eIdx)?.value.trim();
  if (val !== undefined) saveExNote(exId, val);
  renderTodayCard();
}

function deleteTodayEntry(sesId, eIdx) {
  const s = sessions.find(x => x.id === sesId);
  if (!s) return;
  s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== sesId);
  save();
  renderTodayCard();
}

function editTodaySet(sesId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === parseInt(sesId));
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const row = document.getElementById(rowId);
  if (!row) return;
  row.innerHTML = `
    <div style="display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-sets-${rowId}" value="${set.sets}" min="1" style="width:52px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">sets</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-reps-${rowId}" value="${set.reps}" min="1" style="width:52px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">reps</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <input type="number" id="ts-weight-${rowId}" value="${set.weight}" min="0" style="width:60px;font-size:13px;padding:5px 7px">
        <span style="font-size:12px;color:var(--text3)">lbs</span>
      </div>
    </div>
    <div style="display:flex;gap:5px">
      <button class="btn btn-sm btn-g" onclick="saveTodaySet('${sesId}',${eIdx},${sIdx},'${rowId}')">✓</button>
      <button class="btn btn-sm" onclick="renderTodayCard()">✕</button>
    </div>`;
}

function saveTodaySet(sesId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === parseInt(sesId));
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  set.sets = parseInt(document.getElementById(`ts-sets-${rowId}`)?.value) || set.sets;
  set.reps = parseInt(document.getElementById(`ts-reps-${rowId}`)?.value) || set.reps;
  set.weight = parseFloat(document.getElementById(`ts-weight-${rowId}`)?.value) || 0;
  set.totalWeight = set.eachHand ? set.weight * 2 : set.weight;
  save();
  renderTodayCard();
}

function toggleCard(id) {
  expId = expId === id ? null : id;
  renderFavGrid();
  // refresh browse all if open
  if (document.getElementById('browse-all-modal').classList.contains('on')) renderBrowseAll();
}

// ── BROWSE ALL MODAL ───────────────────────────────────────
function openBrowseAll() {
  document.getElementById('browse-all-modal').classList.add('on');
  renderBrowseAll();
}
function closeBrowseAll() {
  document.getElementById('browse-all-modal').classList.remove('on');
  renderFavGrid();
}

function renderBrowseAll() {
  const locF = document.getElementById('ba-loc').value;
  const catF = document.getElementById('ba-cat').value;
  const filtered = EX.filter(e => {
    if (catF !== 'all' && e.cat !== catF) return false;
    if (locF !== 'all' && !e.loc.includes(locF)) return false;
    return true;
  });
  const list = document.getElementById('browse-all-list');
  if (!filtered.length) { list.innerHTML = '<div class="empty">No exercises match.</div>'; return; }
  list.innerHTML = filtered.map(e => {
    const isFav = favorites.has(e.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:15px;font-weight:500;color:var(--text)">${e.name}</div>
        <div style="font-size:12px;color:var(--text3)">${CAT[e.cat]||e.cat} &middot; ${e.loc.map(l=>LOC[l]).join(', ')}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        <button class="star-btn${isFav?' on':''}" onclick="toggleFavFromBrowse('${e.id}')" title="${isFav?'Remove from My exercises':'Add to My exercises'}">&#11088;</button>
        <button class="btn btn-sm" onclick="selectExFromBrowse('${e.id}')">Select</button>
      </div>
    </div>`;
  }).join('');
}

function toggleFavFromBrowse(id) {
  if (favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites();
  renderBrowseAll();
}

function selectExFromBrowse(id) {
  closeBrowseAll();
  selectEx(id);
}

// ── CUSTOM EXERCISES ───────────────────────────────────────
function addCustomEx() {
  const name = document.getElementById('cx-name').value.trim();
  if (!name) { document.getElementById('cx-status').textContent = 'Please enter a name.'; return; }
  const cat = document.getElementById('cx-cat').value;
  const locStr = document.getElementById('cx-loc').value;
  const loc = locStr.split(',');
  const id = 'custom_' + Date.now();
  const ex = {id, name, cat, loc, custom:true, desc:'Custom exercise', targets:'', tip:'', svg:''};
  customEx.push(ex);
  EX.push(ex);
  favorites.add(id);
  saveCustomEx();
  saveFavorites();
  document.getElementById('cx-name').value = '';
  document.getElementById('cx-status').textContent = `"${name}" added to My exercises!`;
  setTimeout(() => document.getElementById('cx-status').textContent = '', 3000);
  renderBrowseAll();
}

function deleteCustomEx(id) {
  if (!confirm('Delete this custom exercise?')) return;
  customEx = customEx.filter(e => e.id !== id);
  const idx = EX.findIndex(e => e.id === id);
  if (idx >= 0) EX.splice(idx, 1);
  favorites.delete(id);
  saveCustomEx();
  saveFavorites();
  renderBrowseAll();
  renderFavGrid();
}

function getExWeightHistory(exId) {
  // Returns {last, pr} from session history for a given exercise
  // Only looks at working sets (not warmup)
  let last = null, pr = null;
  // Sessions are sorted newest first, so iterate in order
  for (const ses of sessions) {
    const entry = ses.entries.find(e => e.exId === exId);
    if (!entry) continue;
    const working = entry.sets.filter(s => s.type !== 'warmup' && s.weight > 0);
    if (!working.length) continue;
    const maxThisSes = Math.max(...working.map(s => s.eachHand ? s.weight : s.weight));
    if (last === null) last = maxThisSes; // first (newest) session found
    if (pr === null || maxThisSes > pr) pr = maxThisSes;
  }
  return {last, pr};
}

  const date = document.getElementById('ses-date').value;
  const loc = document.getElementById('ses-loc').value;
  const ex = EX.find(e => e.id === selId);
  let ses = sessions.find(s => s.date === date);
  if (!ses) { ses = {id: Date.now(), date, entries: []}; sessions.push(ses); }
  const existing = ses.entries.find(en => en.exId === selId && en.location === loc);
  if (existing) { existing.sets.push(...valid); }
  else { ses.entries.push({exId: selId, exName: ex.name, cat: ex.cat, location: loc, sets: valid}); }
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save();

function getSuggestions() {
  const loc = document.getElementById('ses-loc')?.value || 'all';
  const recentCats = getRecentlyTrainedCats();

  // Get today's already-logged exercise IDs (skip these specific exercises)
  const today = localDate();
  const todaySes = sessions.find(s => s.date === today);
  const todayExIds = new Set(todaySes ? todaySes.entries.map(e => e.exId) : []);

  // Build pool filtered by location
  const locPool = EX.filter(e => loc === 'all' || e.loc.includes(loc));

  // Only skip specific exercises already done today + previous days' recovery categories
  const fresh = locPool.filter(e =>
    !todayExIds.has(e.id) &&
    !recentCats.has(e.cat) &&
    !['balance','mobility','yoga'].includes(e.cat)
  );
  const pool = fresh.length >= 3 ? fresh : locPool.filter(e =>
    !todayExIds.has(e.id) &&
    !['balance','mobility','yoga'].includes(e.cat)
  );

  // Pick 5 diverse exercises across different categories
  const picked = [];
  const usedCats = new Set();
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  for (const ex of shuffled) {
    if (!usedCats.has(ex.cat)) { picked.push(ex); usedCats.add(ex.cat); }
    if (picked.length >= 5) break;
  }
  if (picked.length < 5) {
    for (const ex of shuffled) {
      if (!picked.find(p => p.id === ex.id)) picked.push(ex);
      if (picked.length >= 5) break;
    }
  }

  const el = document.getElementById('suggestions-list');
  if (!picked.length) { el.innerHTML = '<div style="color:var(--text3);font-size:14px;padding:8px 0">No exercises available — try changing location.</div>'; return; }

  // Build context message
  const msgs = [];
  if (todayExIds.size > 0) msgs.push(`skipping ${todayExIds.size} already done today`);
  if (recentCats.size > 0) msgs.push(`avoiding from previous days: ${[...recentCats].map(c => CAT[c]||c).join(', ')}`);
  const contextMsg = msgs.length
    ? `<div style="font-size:12px;color:var(--text3);margin-bottom:10px">${msgs.join(' · ')}</div>`
    : '';

  el.innerHTML = contextMsg + picked.map(ex => {
    return `<div id="sug-row-${ex.id}" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectSuggestion('${ex.id}')">
      <div>
        <div style="font-size:16px;font-weight:600;color:#111">${ex.name}</div>
        <div style="font-size:13px;color:#333">${CAT[ex.cat]||ex.cat}</div>
      </div>
      <span style="font-size:22px;color:var(--accent)">+</span>
    </div>`;
  }).join('');
}

const HSUB = {bench:'incline_ball',row_barbell:'row_db',ohp:'db_shoulder_press',skull_crusher:'band_tricep',pullup:'band_row',squat:'goblet_squat',deadlift:'band_rdl',leg_press:'goblet_squat',hip_thrust:'glute_bridge',cable_crunch:'crunch',foam_roller_back:'cat_cow',foam_roller_legs:'hip_circle',single_leg_rdl_bal:'single_leg_stand'};
const TSUB = {...HSUB, db_lateral:'band_lateral',db_shoulder_press:'band_ohp',bicep_curl:'band_curl',tricep_dip:'band_tricep',row_db:'band_row',rdl:'band_rdl',goblet_squat:'band_squat',db_lunge:'band_squat',incline_ball:'pushup',glute_bridge:'glute_bridge'};

function resolveId(id, loc) {
  const ex = EX.find(e => e.id === id);
  if (ex && ex.loc.includes(loc)) return id;
  const subs = loc === 'home' ? HSUB : TSUB;
  const sub = subs[id];
  if (sub && EX.find(e => e.id === sub && e.loc.includes(loc))) return sub;
  const fb = EX.find(e => ex && e.cat === ex.cat && e.loc.includes(loc));
  return fb ? fb.id : id;
}

function pickN(pool, n, loc) {
  const out = [], seen = new Set();
  for (const id of pool) {
    const rid = resolveId(id, loc);
    if (!seen.has(rid) && EX.find(e => e.id === rid)) { seen.add(rid); out.push(rid); }
    if (out.length >= n) break;
  }
  return out;
}

function getSR(goal, energy, sec) {
  if (sec === 'balance') return {sets:2, reps:'30 sec each side'};
  if (sec === 'warmup' || sec === 'stretch') return {sets:1, reps:'8–10 reps'};
  if (goal === 'strength') return {sets: energy==='low'?2:3, reps: energy==='high'?'6–8': energy==='low'?'10':'8–10'};
  return {sets: energy==='low'?2:3, reps: energy==='high'?'12–15': energy==='low'?'10–12':'12–15'};
}

function launchFireworks() {
  // Only show if user is on the Daily tab
  const dailyPage = document.getElementById('page-daily');
  if (!dailyPage || !dailyPage.classList.contains('on')) return;

  // Fullscreen overlay with light purple background
  const overlay = document.createElement('div');
  overlay.id = 'fw-fullscreen';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;background:rgba(83,74,183,0.18);transition:opacity 1s';
  document.body.appendChild(overlay);

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  overlay.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;

  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43','#fff','#ff6eb4','#00e5ff','#ffb347'];

  const rockets = [];
  const explosions = [];

  function launchRocket() {
    const x = W * (0.15 + Math.random() * 0.7);
    rockets.push({
      x, y: H,
      vy: -(8 + Math.random() * 6),
      targetY: H * (0.1 + Math.random() * 0.5),
      color: colors[Math.floor(Math.random() * colors.length)],
      trail: []
    });
  }

  function explode(x, y, color) {
    const count = 60 + Math.floor(Math.random() * 30);
    const streaks = [];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i;
      const speed = 2.5 + Math.random() * 4;
      streaks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        length: 6 + Math.random() * 8,
        color,
        gravity: 0.06 + Math.random() * 0.04
      });
    }
    // Add a few glitter sparks
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2;
      streaks.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        alpha: 1,
        length: 2,
        color: '#fff',
        gravity: 0.1
      });
    }
    explosions.push({streaks, age: 0});
  }

  let frame = 0;
  // Launch schedule
  const launchTimes = [0, 25, 45, 70, 90, 115, 140, 160, 185, 210, 235, 255, 280, 310];

  function animate() {
    ctx.clearRect(0, 0, W, H);

    // Launch rockets on schedule
    if (launchTimes.includes(frame)) launchRocket();

    // Update and draw rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.trail.push({x: r.x, y: r.y});
      if (r.trail.length > 12) r.trail.shift();

      // Draw trail
      for (let t = 0; t < r.trail.length; t++) {
        const alpha = (t / r.trail.length) * 0.7;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.trail[t].x, r.trail[t].y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw rocket head
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
      ctx.fill();

      r.y += r.vy;

      // Explode when reaching target
      if (r.y <= r.targetY) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    // Update and draw explosions
    for (let e = explosions.length - 1; e >= 0; e--) {
      const exp = explosions[e];
      exp.age++;
      let allDead = true;

      for (let s = exp.streaks.length - 1; s >= 0; s--) {
        const streak = exp.streaks[s];
        streak.alpha -= 0.018;
        if (streak.alpha <= 0) { exp.streaks.splice(s, 1); continue; }
        allDead = false;

        const nx = streak.x + streak.vx;
        const ny = streak.y + streak.vy;

        ctx.globalAlpha = streak.alpha;
        ctx.strokeStyle = streak.color;
        ctx.lineWidth = streak.length > 4 ? 2 : 1;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(streak.x, streak.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        streak.x = nx;
        streak.y = ny;
        streak.vy += streak.gravity;
        streak.vx *= 0.97;
      }

      if (allDead) explosions.splice(e, 1);
    }

    ctx.globalAlpha = 1;
    frame++;

    if (frame < 360) {
      requestAnimationFrame(animate);
    } else {
      // Fade out overlay
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 1000);
    }
  }

  animate();
}

function toggleDailyCheck(id) {
  const checked = loadDailyChecked();
  if (checked.has(id)) checked.delete(id);
  else checked.add(id);
  saveDailyChecked(checked);
  renderDaily();
}

function resetDailyChecks() {
  localStorage.removeItem(getDailyKey('checked'));
  renderDaily();
}

function resetDailyList() {
  if (!confirm('Reset to default Daily Dozen exercises?')) return;
  localStorage.removeItem(getDailyKey('list'));
  renderDaily();
}

function openDailySwap(idx) {
  dailySwapIdx = idx;
  const list = loadDailyList();
  const item = list[idx];
  document.getElementById('daily-swap-panel').style.display = 'block';
  const sel = document.getElementById('daily-swap-select');
  if (sel) sel.value = item.id;
  const dur = document.getElementById('daily-swap-dur');
  if (dur) dur.value = item.dur;
  document.getElementById('daily-swap-panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeDailySwap() {
  dailySwapIdx = null;
  document.getElementById('daily-swap-panel').style.display = 'none';
}

function confirmDailySwap() {
  if (dailySwapIdx === null) return;
  const list = loadDailyList();
  const newId = document.getElementById('daily-swap-select').value;
  const newDur = document.getElementById('daily-swap-dur').value.trim() || '30 sec';
  list[dailySwapIdx] = {id: newId, dur: newDur};
  saveDailyList(list);
  closeDailySwap();
  renderDaily();
}

// ── SMART EXERCISE SEARCH ──────────────────────────────────
let libraryOpen = false;

function smartExSearch() {
  const query = (document.getElementById('ex-search')?.value || '').trim();
  const el = document.getElementById('smart-search-results');

  if (!query) { el.innerHTML = ''; return; }

  const q = query.toLowerCase();
  const scored = EX.map(e => {
    const name = e.name.toLowerCase();
    const cat = (CAT[e.cat]||e.cat).toLowerCase();
    const targets = (e.targets||'').toLowerCase();
    const id = e.id.toLowerCase();
    let score = 0;
    if (name.startsWith(q)) score += 10;
    else if (name.includes(q)) score += 6;
    if (id.includes(q)) score += 4;
    if (cat.includes(q)) score += 3;
    if (targets.includes(q)) score += 2;
    return {ex: e, score};
  }).filter(s => s.score > 0).sort((a, b) => b.score - a.score).slice(0, 8);

  if (scored.length) {
    el.innerHTML =
      scored.map(({ex}) => `<div onclick="selectExAndOpenForm('${ex.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface2);border-radius:var(--r);margin-bottom:6px;cursor:pointer">
        <div>
          <div style="font-size:16px;font-weight:600;color:#111">${ex.name}</div>
          <div style="font-size:13px;color:#333">${CAT[ex.cat]||ex.cat}</div>
        </div>
        <span style="font-size:24px;color:var(--accent);font-weight:300">+</span>
      </div>`).join('') +
      `<div onclick="showNewExForm('${query}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px dashed var(--border2);border-radius:var(--r);cursor:pointer;margin-top:4px">
        <div style="font-size:14px;color:var(--text2)">Add <strong>"${query}"</strong> as new exercise</div>
        <span style="font-size:20px;color:var(--text3)">+</span>
      </div>`;
  } else {
    el.innerHTML = `<div style="margin-bottom:8px;font-size:14px;color:var(--text2)">No match — add <strong>"${query}"</strong> as new exercise:</div>
      <div id="new-ex-form">${newExFormHTML(query)}</div>`;
  }
}

function showNewExForm(query) {
  const el = document.getElementById('smart-search-results');
  el.innerHTML = `<div style="margin-bottom:8px;font-size:14px;color:var(--text2)">Adding <strong>"${query}"</strong> as new exercise:</div>
    <div id="new-ex-form">${newExFormHTML(query)}</div>`;
}

function addAndSelectNewEx() {
  const name = document.getElementById('new-ex-name')?.value.trim();
  if (!name) return;
  const cat = document.getElementById('new-ex-cat')?.value || 'arms';
  const locStr = document.getElementById('new-ex-loc')?.value || 'gym';
  const loc = locStr.split(',');
  const id = 'custom_' + Date.now();
  const ex = {id, name, cat, loc, custom:true, desc:'Custom exercise', targets:'', tip:'', svg:''};
  customEx.push(ex);
  EX.push(ex);
  favorites.add(id);
  saveCustomEx();
  saveFavorites();
  // Clear search and select the new exercise
  document.getElementById('ex-search').value = '';
  document.getElementById('smart-search-results').innerHTML = '';
  selectExAndOpenForm(id);
}

function toggleLibrary() {
  libraryOpen = !libraryOpen;
  document.getElementById('library-list').style.display = libraryOpen ? 'block' : 'none';
  document.getElementById('library-chev').innerHTML = libraryOpen ? '&#9650;' : '&#9660;';
  if (libraryOpen) renderLibrary();
}

let libExpandId = null;

function getExNotes() {
  try { return JSON.parse(localStorage.getItem('wt-ex-notes') || '{}'); } catch(e) { return {}; }
}

function saveExNote(exId, text) {
  const notes = getExNotes();
  if (text.trim()) notes[exId] = text.trim();
  else delete notes[exId];
  localStorage.setItem('wt-ex-notes', JSON.stringify(notes));
}

function renderLibrary() {
  const cats = [...new Set(EX.map(e => e.cat))];
  const notes = getExNotes();
  const el = document.getElementById('library-list');
  el.innerHTML = cats.map(cat => {
    const exes = EX.filter(e => e.cat === cat);
    return '<div style="margin-bottom:14px">'
      + '<div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)">' + (CAT[cat]||cat) + '</div>'
      + exes.map(ex => {
          const isExp = libExpandId === ex.id;
          const note = notes[ex.id] || '';
          return '<div style="margin-bottom:4px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)">'
            + '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 12px;cursor:pointer;background:var(--surface)" onclick="toggleLibEx(\'' + ex.id + '\')">'
            + '<div>'
            + '<div style="font-size:16px;font-weight:600;color:var(--text)">' + ex.name + '</div>'
            + (note ? '<div style="font-size:12px;color:#7a5c00;background:#fffbeb;border-left:3px solid #f59e0b;padding:4px 8px;border-radius:0 4px 4px 0;margin-top:3px">📝 ' + note.substring(0,40) + (note.length>40?'…':'') + '</div>' : '')
            + '</div>'
            + '<div style="display:flex;align-items:center;gap:10px">'
            + '<span style="font-size:12px;color:var(--text3)">' + (isExp ? '▲' : '▼') + '</span>'
            + '<span onclick="event.stopPropagation();selectExAndOpenForm(\'' + ex.id + '\')" style="font-size:22px;color:var(--accent);line-height:1">+</span>'
            + '</div></div>'
            + (isExp ? '<div style="padding:14px 14px;border-top:1px solid var(--border);background:var(--surface2)">'
              + (ex.desc ? '<div style="font-size:16px;color:var(--text);margin-bottom:10px;line-height:1.6"><strong>How to:</strong> ' + ex.desc + '</div>' : '')
              + (ex.targets ? '<div style="font-size:14px;color:var(--text2);margin-bottom:8px"><strong>Targets:</strong> ' + ex.targets + '</div>' : '')
              + (ex.tip ? '<div style="font-size:14px;color:var(--accent);background:var(--alight);padding:10px 12px;border-radius:8px;margin-bottom:10px;line-height:1.5">💪 ' + ex.tip + '</div>' : '')
              + '<div>'
              + '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px">📝 My notes</div>'
              + '<textarea id="note-' + ex.id + '" placeholder="e.g. Keep elbows in, relax shoulders, trainer tip..." style="font-family:\'DM Sans\',sans-serif;font-size:14px;width:100%;padding:10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);resize:none;height:80px;line-height:1.5">' + note + '</textarea>'
              + '<button onclick="saveExNote(\'' + ex.id + '\',document.getElementById(\'note-' + ex.id + '\').value);renderLibrary()" class="btn btn-sm btn-g" style="margin-top:6px">Save note</button>'
              + '</div>'
              + '</div>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  }).join('');
}

function toggleLibEx(id) {
  libExpandId = libExpandId === id ? null : id;
  renderLibrary();
}
// Large groups need 48hrs, small groups 24hrs, mobility/balance anytime
const RECOVERY_HOURS = {
  legs: 48, back: 48, glutes: 48, chest: 48,
  shoulders: 24, arms: 24, core: 24,
  balance: 0, mobility: 0, yoga: 0,
};

function getRecentlyTrainedCats() {
  const now = new Date();
  const recentCats = new Set();
  sessions.forEach(s => {
    const sesDate = new Date(s.date + 'T12:00:00');
    const hoursAgo = (now - sesDate) / (1000 * 60 * 60);
    s.entries.forEach(e => {
      const recovery = RECOVERY_HOURS[e.cat] ?? 24;
      if (recovery > 0 && hoursAgo <= recovery) {
        recentCats.add(e.cat);
      }
    });
  });
  return recentCats;
}

function buildPlan() {
  const {loc, focus, goal, energy} = qaAns;

  // Get recently trained categories to avoid
  const recentCats = getRecentlyTrainedCats();

  // Filter main pool to exclude recently trained muscle groups
  // But only if there are enough alternatives — don't leave user with nothing
  const rawMainPool = POOL[goal][focus] || POOL.strength.upper;
  const freshPool = rawMainPool.filter(id => {
    const ex = EX.find(e => e.id === id) || EX.find(e => e.id === resolveId(id, loc));
    return ex && !recentCats.has(ex.cat);
  });
  // Use fresh pool if it has at least 2 exercises, otherwise fall back to full pool
  const mainPool = freshPool.length >= 2 ? freshPool : rawMainPool;

  const wuPool = POOL.warmup[focus] || POOL.warmup.upper;
  const stPool = POOL.stretch[focus] || POOL.stretch.upper;
  const balPool = POOL.balance[focus] || POOL.balance.upper;
  const fwu = wuPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  const fst = stPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  const fbal = balPool.filter(id => { const e = EX.find(x => x.id === id); return e && (loc === 'gym' || e.loc.includes(loc)); });
  plan = [
    ...pickN(fwu, 3, loc).map(id => ({exId:id, sec:'warmup', ...getSR(goal,energy,'warmup'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(mainPool, 3, loc).map(id => ({exId:id, sec:'main', ...getSR(goal,energy,'main'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(fbal, 2, loc).map(id => ({exId:id, sec:'balance', ...getSR(goal,energy,'balance'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
    ...pickN(fst, 3, loc).map(id => ({exId:id, sec:'stretch', ...getSR(goal,energy,'stretch'), swapOpen:false, actionOpen:false, detailOpen:false, logOpen:false, logged:false, handMode:'each', planSets:[], planSetType:'working', tip:tipFor(id,goal)})),
  ];
  // Store recovery info for display
  plan._recentCats = [...recentCats];
  drawPlan();
}

function drawPlan() {
  const {loc, focus, goal, energy} = qaAns;
  const fl = {upper:'Upper body', lower:'Lower body', full:'Full body', core:'Core & stability'}[focus];
  const gl = goal === 'strength' ? 'Strength' : 'Tone & endurance';
  const el = {high:'High energy', medium:'Solid session', low:'Easy session'}[energy];
  const sections = [
    {key:'warmup',  label:'Warm-up & Mobility',   cls:'tag-wu'},
    {key:'main',    label:'Main workout',           cls:'tag-main'},
    {key:'balance', label:'Balance',                cls:'tag-bal'},
    {key:'stretch', label:'Cool-down & stretches',  cls:'tag-str'},
  ];
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;flex-wrap:wrap;gap:6px">
    <div style="font-size:12px;color:var(--text2)">${fl} &middot; ${gl} &middot; ${el} &middot; ${LOC[loc]}</div>
    <button class="btn btn-sm" onclick="qaAns={};qaStep=0;initCoach()">&#8592; Start over</button>
  </div>`;
  sections.forEach(sec => {
    const items = plan.filter(i => i.sec === sec.key);
    if (!items.length && sec.key !== 'main') return;
    html += `<div class="plan-sec"><span class="sec-tag ${sec.cls}">${sec.label}</span>`;
    items.forEach(item => {
      const idx = plan.indexOf(item);
      const ex = EX.find(e => e.id === item.exId);
      if (!ex) return;
      const {last, pr} = getExWeightHistory(item.exId);
      const isBilateral = BILATERAL.has(item.exId);
      const defaultWeight = last !== null ? last : 0;
      const defaultSets = item.sets;
      const defaultReps = parseReps(item.reps);
      const fade = item.logged ? 'opacity:.45' : '';

      html += `<div style="border-bottom:1px solid var(--border);padding:10px 0;${fade}">
        <div style="display:flex;align-items:flex-start;gap:9px">
          <div style="flex:1">
            <div class="plan-nm">
              <button onclick="togglePlanDetail(${idx})" style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);text-align:left;padding:0;display:inline">${ex.name}</button>
              ${item.logged ? ` <span style="font-size:11px;color:var(--accent);font-style:normal">&#10003; logged</span>` : ''}
              <span style="font-size:12px;color:var(--text3);margin-left:4px">${item.detailOpen ? '&#9650;' : '&#9660;'}</span>
            </div>
            <div class="plan-sr">${item.sets} set${item.sets>1?'s':''} &times; ${item.reps}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0">
            ${!item.logged ? `<button class="swap-btn" onclick="toggleLogForm(${idx})" style="${item.logOpen?'border-color:var(--accent);color:var(--accent)':''}">&#9998; ${item.logOpen ? 'Close' : 'Log it'}</button>` : `<button class="swap-btn" style="color:var(--danger);border-color:var(--danger)" onclick="unlogPlanItem(${idx})">&#x2715; Remove</button>`}
            ${!item.logged ? `<button class="swap-btn" onclick="toggleAction(${idx})">${item.actionOpen ? '&#x2715;' : '&#8942;'}</button>` : ''}
          </div>
        </div>`;

      if (item.detailOpen) {
        html += `<div style="background:var(--surface2);border-radius:var(--r);padding:12px;margin:8px 0 4px;border:1px solid var(--border)">
          <div class="ec-inner">
            <div>${ex.svg}</div>
            <div>
              <div class="di-row"><div class="di-lbl">How to</div><div class="di-val">${ex.desc}</div></div>
              <div class="di-row"><div class="di-lbl">Targets</div><div class="di-val">${ex.targets}</div></div>
              <div class="di-row"><div class="di-lbl">&#128170; Tip</div><div class="di-tip">${ex.tip}</div></div>
            </div>
          </div>
        </div>`;
      }

      if (item.logOpen && !item.logged) {
        const memHint = (last !== null || pr !== null)
          ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px;padding:6px 9px;background:var(--surface2);border-radius:var(--r);display:flex;gap:12px;flex-wrap:wrap">
              ${last !== null ? `<span>Last: <strong>${last} lbs</strong></span>` : ''}
              ${pr !== null && pr !== last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong></span>` : ''}
              ${pr !== null && pr === last ? `<span style="color:var(--gold)">&#127942; PR: <strong>${pr} lbs</strong> (your best!)</span>` : ''}
             </div>` : '';
        html += `<div style="background:var(--alight);border-radius:var(--r);padding:12px;margin:8px 0 4px;border:1px solid var(--accent)">
          ${memHint}
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px">
            <div><span class="lbl">Sets</span><input type="number" id="pls-${idx}" min="1" value="${defaultSets}" style="font-size:15px;padding:8px 9px"></div>
            <div><span class="lbl">Reps</span><input type="number" id="plr-${idx}" min="1" value="${defaultReps}" style="font-size:15px;padding:8px 9px"></div>
            <div><span class="lbl">Weight (lbs)</span><input type="number" id="plw-${idx}" min="0" value="${defaultWeight}" placeholder="0=BW" style="font-size:15px;padding:8px 9px"></div>
          </div>
          ${isBilateral ? `<div style="display:flex;gap:6px;margin-bottom:8px">
            <button class="stype ${item.handMode!=='total'?'on':''}" onclick="setPlanHandMode(${idx},'each')">Each hand</button>
            <button class="stype ${item.handMode==='total'?'on':''}" onclick="setPlanHandMode(${idx},'total')">Total weight</button>
          </div>
          <div id="plhint-${idx}" style="font-size:12px;color:var(--text3);margin-bottom:8px"></div>` : ''}
          <div style="display:flex;gap:8px;margin-bottom:4px">
            <button class="stype on" id="pltype-w-${idx}" onclick="setPlanSetType(${idx},'working')">Working set</button>
            <button class="stype" id="pltype-wu-${idx}" onclick="setPlanSetType(${idx},'warmup')">Warm-up</button>
          </div>
          <div id="pl-setlist-${idx}" style="margin:6px 0;display:flex;flex-direction:column;gap:4px"></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
            <button class="btn btn-sm" onclick="addPlanSet(${idx})" style="background:var(--surface)">+ Add set</button>
            <button class="btn btn-sm btn-g" onclick="savePlanItem(${idx})">&#10003; Save &amp; log</button>
          </div>
          <div id="pl-status-${idx}" style="font-size:12px;color:var(--accent);margin-top:5px;font-weight:500"></div>
        </div>`;
      }

      if (item.actionOpen) {
        html += `<div class="action-menu">
          <button class="action-item" onclick="openSwap(${idx})">&#8635; Swap exercise</button>
          <button class="action-item action-delete" onclick="deletePlanItem(${idx})">&#x2715; Delete today</button>
        </div>`;
      }
      if (item.swapOpen) html += buildSwapPanel(idx, ex.cat);
      html += `</div>`;
    });
    html += `<button class="add-ex-btn" onclick="openAddExercise('${sec.key}')">+ Add exercise to ${sec.label.toLowerCase()}</button>`;
    html += `</div>`;
  });
  const allLogged = plan.every(i => i.logged);
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center">
    ${allLogged
      ? `<div style="font-size:14px;color:var(--accent);font-weight:500;padding:8px 0">&#127942; Workout complete!</div>`
      : `<button class="btn btn-g" onclick="completeAll()">&#9998; Log next exercise</button>`}
    <button class="btn" onclick="buildPlan()">&#8635; Regenerate</button>
    <button class="btn btn-sm" onclick="qaAns={};qaStep=0;initCoach()">&#8592; Start over</button>
  </div>`;
  const _cp = document.getElementById('coach-plan'); if(_cp) _cp.innerHTML = html;
}

function toggleAction(idx) {
  plan[idx].actionOpen = !plan[idx].actionOpen;
  plan[idx].swapOpen = false;
  drawPlan();
}

function togglePlanDetail(idx) {
  plan[idx].detailOpen = !plan[idx].detailOpen;
  plan[idx].actionOpen = false;
  drawPlan();
}

function openSwap(idx) {
  plan[idx].swapOpen = true;
  plan[idx].actionOpen = false;
  drawPlan();
}

function toggleSwap(idx) { plan[idx].swapOpen = !plan[idx].swapOpen; drawPlan(); }

function deletePlanItem(idx) {
  plan.splice(idx, 1);
  drawPlan();
}

function parseReps(repsStr) {
  const match = String(repsStr).match(/\d+/);
  return match ? parseInt(match[0]) : 10;
}

function toggleLogForm(idx) {
  plan[idx].logOpen = !plan[idx].logOpen;
  plan[idx].actionOpen = false;
  plan[idx].planSets = [];
  drawPlan();
}

function setPlanHandMode(idx, mode) {
  plan[idx].handMode = mode;
  drawPlan();
  // Update hint
  const w = parseFloat(document.getElementById('plw-'+idx)?.value) || 0;
  const hint = document.getElementById('plhint-'+idx);
  if (hint) hint.textContent = mode==='each' && w>0 ? `${w} lbs each hand = ${w*2} lbs total` : mode==='total' && w>0 ? `${w} lbs total` : '';
}

function setPlanSetType(idx, t) {
  plan[idx].planSetType = t;
  const wBtn = document.getElementById(`pltype-w-${idx}`);
  const wuBtn = document.getElementById(`pltype-wu-${idx}`);
  if (wBtn) wBtn.classList.toggle('on', t==='working');
  if (wuBtn) wuBtn.classList.toggle('on', t==='warmup');
}

function addPlanSet(idx) {
  const sets = parseInt(document.getElementById('pls-'+idx)?.value) || 1;
  const reps = parseInt(document.getElementById('plr-'+idx)?.value) || 10;
  const weight = parseFloat(document.getElementById('plw-'+idx)?.value) || 0;
  const t = plan[idx].planSetType || 'working';
  const isBilateral = BILATERAL.has(plan[idx].exId) && weight > 0;
  const eachHand = isBilateral && plan[idx].handMode !== 'total';
  const totalWeight = eachHand ? weight * 2 : weight;
  const setEntry = {sets, reps, weight, type:t, eachHand, totalWeight};
  plan[idx].planSets.push(setEntry);
  // Render set list without full redraw
  const listEl = document.getElementById('pl-setlist-'+idx);
  if (listEl) {
    const wl = weight===0 ? 'bodyweight' : eachHand ? `${weight} lbs each hand (${totalWeight} lbs total)` : `${weight} lbs`;
    const chip = document.createElement('div');
    chip.className = `sc ${t}`;
    chip.innerHTML = `<span>${t==='warmup'?'<span style="font-size:10px;margin-right:4px;opacity:.7">WARM-UP</span>':''}${sets}&times;${reps} @ ${wl}</span>
      <button class="del-btn" onclick="removePlanSet(${idx},${plan[idx].planSets.length-1})">&#x2715;</button>`;
    listEl.appendChild(chip);
  }
}

function removePlanSet(idx, setIdx) {
  plan[idx].planSets[setIdx] = null;
  drawPlan();
}

function savePlanItem(idx) {
  const valid = plan[idx].planSets.filter(Boolean);
  if (!valid.length) {
    const s = document.getElementById('pl-status-'+idx);
    if (s) s.textContent = 'Add at least one set first.';
    return;
  }
  const ex = EX.find(e => e.id === plan[idx].exId);
  if (!ex) return;
  const date = localDate();
  const loc = qaAns.loc || 'gym';
  let ses = sessions.find(s => s.date===date);
  if (!ses) { ses = {id:Date.now(), date, entries:[]}; sessions.push(ses); }
  const existing = ses.entries.find(en => en.exId === plan[idx].exId && en.location === loc);
  if (existing) { existing.sets.push(...valid); }
  else { ses.entries.push({exId:plan[idx].exId, exName:ex.name, cat:ex.cat, location:loc, sets:valid}); }
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save();
  // Auto-add to favorites so it appears in My exercises
  favorites.add(plan[idx].exId);
  saveFavorites();
  plan[idx].logged = true;
  plan[idx].logOpen = false;
  plan[idx].planSets = [];
  drawPlan();
  // Update Today's session on Log tab
  renderTodayCard();
}

function unlogPlanItem(idx) {
  const date = localDate();
  const loc = qaAns.loc || 'gym';
  const ses = sessions.find(s => s.date===date);
  if (ses) {
    ses.entries = ses.entries.filter(en => !(en.exId === plan[idx].exId && en.location === loc));
    if (!ses.entries.length) sessions = sessions.filter(s => s.id !== ses.id);
    save();
  }
  plan[idx].logged = false;
  plan[idx].logOpen = false;
  plan[idx].planSets = [];
  drawPlan();
}

function logPlanItem(idx) { toggleLogForm(idx); }

function completeAll() {
  // Open log form for first unlogged item instead of auto-logging everything
  const first = plan.findIndex(i => !i.logged);
  if (first >= 0) toggleLogForm(first);
}

function doSwap(idx, newId) { plan[idx].exId = newId; plan[idx].swapOpen = false; drawPlan(); }

function buildSwapPanel(idx, cat) {
  const loc = qaAns.loc || 'gym';
  const alts = EX.filter(e => e.cat === cat && e.loc.includes(loc) && e.id !== plan[idx].exId).slice(0, 5);
  let html = `<div class="swap-panel"><div class="swap-ttl">Coach alternatives — ${CAT[cat]||cat}</div>`;
  if (alts.length) {
    alts.forEach(a => html += `<div class="swap-opt" onclick="doSwap(${idx},'${a.id}')"><span class="swap-nm">${a.name}</span><span class="swap-meta">${a.loc.map(l=>LOC[l]).join(', ')}</span></div>`);
  } else {
    html += `<div style="font-size:12px;color:var(--text3);padding:3px 0">No other options for this category at ${LOC[loc]}.</div>`;
  }
  html += `<button class="browse-link" onclick="openBrowse(${idx})">Browse all exercises &rarr;</button></div>`;
  return html;
}

let browseMode = 'swap'; // 'swap' or 'add'
let browseAddSec = null;

function openBrowse(idx) { browseIdx = idx; browseMode = 'swap'; browseCat = 'all'; document.getElementById('browse-modal').classList.add('on'); renderBrowse(); }

function openAddExercise(sec) {
  browseIdx = null; browseMode = 'add'; browseAddSec = sec; browseCat = 'all';
  document.getElementById('browse-modal').classList.add('on');
  renderBrowse();
}
function closeBrowse() { document.getElementById('browse-modal').classList.remove('on'); browseIdx = null; }

function renderBrowse() {
  document.getElementById('browse-chips').innerHTML =
    ['all',...CATS].map(c => `<button class="chip${browseCat===c?' on':''}" onclick="setBrowseCat('${c}')">${c==='all'?'All':CAT[c]}</button>`).join('');
  const list = EX.filter(e => browseCat === 'all' || e.cat === browseCat);
  document.getElementById('browse-list').innerHTML = list.map(e =>
    `<div class="br-row" onclick="browseSwap('${e.id}')"><span class="br-nm">${e.name}</span><span class="br-meta">${CAT[e.cat]}</span></div>`
  ).join('');
}

function setBrowseCat(c) { browseCat = c; renderBrowse(); }

function browseSwap(id) {
  if (browseMode === 'swap' && browseIdx !== null) {
    plan[browseIdx].exId = id;
    plan[browseIdx].swapOpen = false;
    plan[browseIdx].actionOpen = false;
  } else if (browseMode === 'add' && browseAddSec) {
    const {loc, goal, energy} = qaAns;
    plan.push({exId:id, sec:browseAddSec, ...getSR(goal,energy,browseAddSec), swapOpen:false, actionOpen:false, tip:tipFor(id,goal)});
  }
  closeBrowse(); drawPlan();
}

function loadPlanToLog() {
  if (!plan.length) return;
  showPage('coach');
  document.getElementById('ses-loc').value = qaAns.loc || 'gym';
  syncLoc();
  const first = plan.find(i => i.sec === 'main') || plan[0];
  if (first) selectEx(first.exId);
  window.scrollTo({top: 0, behavior:'smooth'});
  const sections = {
    warmup: plan.filter(i=>i.sec==='warmup').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    main:   plan.filter(i=>i.sec==='main').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    balance:plan.filter(i=>i.sec==='balance').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
    stretch:plan.filter(i=>i.sec==='stretch').map(i=>EX.find(e=>e.id===i.exId)?.name||'').filter(Boolean),
  };
  const note = document.createElement('div');
  note.className = 'coach-note';
  note.style.cssText = 'background:var(--alight);border:1px solid var(--accent);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-size:13px;color:var(--accent)';
  note.innerHTML = `<strong>&#127947; Coach plan loaded</strong><br>
    <span style="color:var(--text2)">Warm-up:</span> ${sections.warmup.join(', ')}<br>
    <span style="color:var(--text2)">Main:</span> ${sections.main.join(', ')}<br>
    <span style="color:var(--text2)">Balance:</span> ${sections.balance.join(', ')}<br>
    <span style="color:var(--text2)">Stretches:</span> ${sections.stretch.join(', ')}`;
  const pg = document.getElementById('page-coach');
  const ex = pg.querySelector('.coach-note'); if(ex) ex.remove();
  pg.insertBefore(note, pg.firstChild);
}

// ── HISTORY ────────────────────────────────────────────────
function renderHistory() {
  const lf = document.getElementById('hist-loc').value;
  const cf = document.getElementById('hist-cat').value;
  const filtered = sessions.filter(s => {
    if (lf !== 'all' && !s.entries.some(e => (e.location||'gym') === lf)) return false;
    if (cf !== 'all' && !s.entries.some(e => e.cat === cf)) return false;
    return true;
  });
  const el = document.getElementById('hist-list');
  if (!filtered.length) { el.innerHTML = '<div class="empty">No sessions logged yet.</div>'; return; }
  el.innerHTML = filtered.map(s => {
    const entries = s.entries.filter(e => cf === 'all' || e.cat === cf);
    const ds = new Date(s.date + 'T12:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    return `<div class="hc">
      <div class="hc-hd">
        <div>
          <span style="font-size:14px;font-weight:600">${ds}</span>

            <button class="btn btn-sm" style="font-size:11px;padding:3px 9px;color:var(--danger);border-color:var(--danger)" onclick="delSession(${s.id})">&#x2715; Delete session</button>
          </div>
        </div>
      </div>
      ${entries.map((e, ei) => {
        const sIdx = sessions.findIndex(x => x.id === s.id);

        return `<div class="he">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div class="he-nm">${e.exName} <span class="pill pill-${e.location||'gym'}">${LOC[e.location||'gym']||'Gym'}</span></div>
            <button class="btn btn-sm" style="font-size:11px;padding:3px 9px;color:var(--danger);border-color:var(--danger)" onclick="delExEntry(${s.id},${eIdx})">&#x2715; Remove</button>
          </div>
          <div class="he-sets">
            ${e.sets.map((s2, si) => {

              const tag = s2.type==='warmup'?'<span style="font-size:10px;background:var(--warn-light);color:var(--warn);padding:1px 5px;border-radius:8px;margin-right:3px">WU</span>':'';
              return `<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--border)" id="set-row-${s.id}-${eIdx}-${si}">
                <span style="flex:1;font-size:13px">${tag}${s2.sets}&times;${s2.reps} @ ${wl}</span>
                <button class="btn btn-sm" style="font-size:11px;padding:3px 8px" onclick="editSet(${s.id},${eIdx},${si})">&#9998;</button>

          </div>
          <div style="margin-bottom:8px">
            <span class="lbl">Location</span>
            <select id="aes-loc-${s.id}" style="font-size:14px">
              <option value="gym">Gym</option>
              <option value="home">Home</option>
              <option value="travel">Traveling</option>
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px">
            <div><span class="lbl">Sets</span><input type="number" id="aes-sets-${s.id}" min="1" value="3" style="font-size:14px;padding:7px 9px"></div>
            <div><span class="lbl">Reps</span><input type="number" id="aes-reps-${s.id}" min="1" value="10" style="font-size:14px;padding:7px 9px"></div>
            <div><span class="lbl">Weight</span><input type="number" id="aes-weight-${s.id}" min="0" value="0" style="font-size:14px;padding:7px 9px"></div>
          </div>
          <div style="margin-bottom:8px">
            <span class="lbl">Type</span>
            <select id="aes-type-${s.id}" style="font-size:14px">
              <option value="working">Working set</option>
              <option value="warmup">Warm-up set</option>
            </select>
          </div>
          <div style="display:flex;gap:7px">
            <button class="btn btn-g btn-sm" onclick="addExToSession(${s.id})">&#10003; Save</button>
            <button class="btn btn-sm" onclick="showAddExToSession(${s.id})">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function delSession(id) {
  if (!confirm('Delete this entire session?')) return;
  sessions = sessions.filter(s => s.id !== id);
  save(); renderHistory();
  if (document.getElementById('dash-stats-view').style.display !== 'none') renderDashboard();
}

function editSessionDate(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  const newDate = prompt('Enter new date (YYYY-MM-DD):', s.date);
  if (!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate)) { alert('Invalid date format. Use YYYY-MM-DD.'); return; }
  s.date = newDate;
  sessions.sort((a,b) => b.date.localeCompare(a.date));
  save(); renderHistory();
}

function delExEntry(sessionId, eIdx) {
  if (!confirm('Remove this exercise from the session?')) return;
  const s = sessions.find(x => x.id === sessionId);
  if (!s) return;
  s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== sessionId);
  save(); renderHistory();
}

function delSet(sessionId, eIdx, sIdx) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  s.entries[eIdx].sets.splice(sIdx, 1);
  if (!s.entries[eIdx].sets.length) s.entries.splice(eIdx, 1);
  if (!s.entries.length) sessions = sessions.filter(x => x.id !== sessionId);
  save(); renderHistory();
}

function editSet(sessionId, eIdx, sIdx) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const rowId = `set-row-${sessionId}-${eIdx}-${sIdx}`;
  const row = document.getElementById(rowId);
  if (!row) return;
  // Replace row with inline edit form
  const isBilateral = set.eachHand;
  row.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:1">
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Sets</span>
        <input type="number" id="es-sets-${rowId}" value="${set.sets}" min="1" style="font-size:13px;padding:5px 7px;width:100%"></div>
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Reps</span>
        <input type="number" id="es-reps-${rowId}" value="${set.reps}" min="1" style="font-size:13px;padding:5px 7px;width:100%"></div>
      <div><span style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Weight (lbs)</span>
        <input type="number" id="es-weight-${rowId}" value="${set.weight}" min="0" style="font-size:13px;padding:5px 7px;width:100%"></div>
    </div>
    <div style="display:flex;gap:5px;margin-top:6px;flex-shrink:0">
      <button class="btn btn-sm btn-g" onclick="saveEditSet(${sessionId},${eIdx},${sIdx},'${rowId}')">&#10003; Save</button>
      <button class="btn btn-sm" onclick="renderHistory()">Cancel</button>
    </div>`;
}

function saveEditSet(sessionId, eIdx, sIdx, rowId) {
  const s = sessions.find(x => x.id === sessionId);
  if (!s || !s.entries[eIdx]) return;
  const set = s.entries[eIdx].sets[sIdx];
  const newSets = parseInt(document.getElementById(`es-sets-${rowId}`)?.value) || set.sets;
  const newReps = parseInt(document.getElementById(`es-reps-${rowId}`)?.value) || set.reps;
  const newWeight = parseFloat(document.getElementById(`es-weight-${rowId}`)?.value) || 0;
  set.sets = newSets;
  set.reps = newReps;
  set.weight = newWeight;
  set.totalWeight = set.eachHand ? newWeight * 2 : newWeight;
  save(); renderHistory();
}

// ── ADD TO HISTORY ──────────────────────────────────────────
function showAddPastSession() {
  const el = document.getElementById('add-past-session-form');
  el.style.display = 'block';
  // Default to yesterday
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  document.getElementById('past-ses-date').value = localDate(yesterday);
}

function hideAddPastSession() {
  document.getElementById('add-past-session-form').style.display = 'none';
}

function createPastSession() {
  const date = document.getElementById('past-ses-date').value;
  if (!date) { alert('Please select a date.'); return; }
  let ses = sessions.find(s => s.date === date);
  if (!ses) {
    ses = {id: Date.now(), date, entries: []};
    sessions.push(ses);
    sessions.sort((a,b) => b.date.localeCompare(a.date));
    save();
  }
  hideAddPastSession();
  renderHistory();
}

// Add exercise to an existing session
let addExToSessionId = null;

function showAddExToSession(sessionId) {
  addExToSessionId = sessionId;
  // Close any other open forms first
  document.querySelectorAll('.add-ex-form').forEach(el => el.style.display = 'none');
  const el = document.getElementById('add-ex-form-' + sessionId);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addExToSession(sessionId) {
  const exId = document.getElementById('aes-ex-' + sessionId)?.value;
  const sets = parseInt(document.getElementById('aes-sets-' + sessionId)?.value) || 1;
  const reps = parseInt(document.getElementById('aes-reps-' + sessionId)?.value) || 10;
  const weight = parseFloat(document.getElementById('aes-weight-' + sessionId)?.value) || 0;
  const type = document.getElementById('aes-type-' + sessionId)?.value || 'working';
  if (!exId) { alert('Please select an exercise.'); return; }
  const ex = EX.find(e => e.id === exId);
  if (!ex) return;
  const ses = sessions.find(s => s.id === sessionId);
  if (!ses) return;
  const loc = document.getElementById('aes-loc-' + sessionId)?.value || 'gym';
  const setEntry = {sets, reps, weight, type, eachHand: false, totalWeight: weight};
  const existing = ses.entries.find(en => en.exId === exId && en.location === loc);
  if (existing) { existing.sets.push(setEntry); }
  else { ses.entries.push({exId, exName: ex.name, cat: ex.cat, location: loc, sets: [setEntry]}); }
  save();
  renderHistory();
}

// ── WEIGHT TRACKING ────────────────────────────────────────
function getWeightData() {
  try { return JSON.parse(localStorage.getItem('wt-weight-log') || '[]'); } catch(e) { return []; }
}
function logWeight() {
  const val = parseFloat(document.getElementById('weight-input')?.value);
  if (!val || val < 50 || val > 500) return;
  const data = getWeightData();
  const today = localDate();
  const existing = data.findIndex(w => w.date === today);
  if (existing >= 0) data[existing].weight = val;
  else data.push({date: today, weight: val});
  data.sort((a,b) => a.date.localeCompare(b.date));
  localStorage.setItem('wt-weight-log', JSON.stringify(data));
  renderDashboard();
}

// ── WATER TRACKING ─────────────────────────────────────────
function getWaterKey() { return 'wt-water-' + localDate(); }
function getWaterToday() { return parseInt(localStorage.getItem(getWaterKey()) || '0'); }
function addWaterCup() {
  const cups = getWaterToday() + 1;
  localStorage.setItem(getWaterKey(), cups);
  if (cups === 8) launchWaterCelebration();
  renderDashboard();
}
function removeWaterCup() {
  const cups = Math.max(0, getWaterToday() - 1);
  localStorage.setItem(getWaterKey(), cups);
  renderDashboard();
}
function resetWater() {
  localStorage.setItem(getWaterKey(), 0);
  renderDashboard();
}
function launchWaterCelebration() {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none';
  el.innerHTML = '<div style="background:linear-gradient(135deg,#4d96ff,#00e5ff);border-radius:20px;padding:30px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)">'
    + '<div style="font-size:50px;margin-bottom:8px">💧🎉💧</div>'
    + '<div style="font-family:\'DM Sans\',sans-serif;font-weight:800;font-size:24px;color:#fff;text-transform:uppercase">8 cups!</div>'
    + '<div style="font-size:15px;color:rgba(255,255,255,.9);margin-top:4px">Daily goal reached!</div>'
    + '</div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function renderDashboard() {

    const mx = Math.max(...wk.map(s2 => s2.weight));
